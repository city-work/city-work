                    SUPABASE_ANON_KEY = design.supabase.anonKey;
                    console.log('✅ [CONFIG] Loaded from config.js');
                } else if (typeof window.design !== 'undefined' && window.design.supabase) {
                    SUPABASE_URL = window.design.supabase.url;
                    SUPABASE_ANON_KEY = window.design.supabase.anonKey;
                    console.log('✅ [CONFIG] Loaded from window.design');
                } else {
                    // Fallback hardcoded values
                    SUPABASE_URL = 'https://kqombshcwbqgtwszfycv.supabase.co';
                    SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtxb21ic2hjd2JxZ3R3c3pmeWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTY1ODMsImV4cCI6MjEwMzMzMjU4M30.F90RlAyc7DSJPjeJ9zpTKlMP5aPa8Nzgwxmw23hZ3qM';
                    console.warn('⚠️ [CONFIG] Using hardcoded fallback values');
                }
            } catch (e) {
                console.error('❌ [CONFIG] Failed to load Supabase config:', e);
                document.body.innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#18202F;padding:20px;font-family:Plus Jakarta Sans,sans-serif;">
                        <div style="background:rgba(255,255,255,0.05);backdrop-filter:blur(16px);border-radius:40px;padding:40px;max-width:400px;text-align:center;border:1px solid rgba(255,255,255,0.1);">
                            <i class="fa-solid fa-triangle-exclamation" style="font-size:3rem;color:#B8734F;margin-bottom:12px;"></i>
                            <h2 style="font-size:20px;font-weight:700;color:#FAF7F2;">Configuration Error</h2>
                            <p style="color:rgba(250,247,242,0.7);margin-top:8px;font-size:14px;">Could not load Supabase credentials. Please check <code style="color:#B8734F;">config.js</code>.</p>
                            <a href="../index.html" style="display:inline-block;margin-top:20px;padding:12px 24px;background:#B8734F;color:#FAF7F2;border-radius:12px;text-decoration:none;font-weight:600;">Back to Login</a>
                        </div>
                    </div>
                `;
                return;
            }

            // ─── SCHEMA CONFIGURATION ──────────────────────────────────
            const SCHEMA_CONFIG = {
                schema: 'CLASSICS',
                
                tables: {
                    titles: 'classic_titles',
                    episodes: 'classic_episodes',
                    schedule: 'classic_schedule',
                    turnovers: 'classic_turnovers'
                }
            };

            console.log('📋 [SCHEMA] Using schema:', SCHEMA_CONFIG.schema);

            // ─── DOM REFS ──────────────────────────────────────────────
            const $ = id => document.getElementById(id);
            const statusBadge = $('statusBadge');
            const messageArea = $('messageArea');
            const overviewPanel = $('overviewPanel');
            const showViewPanel = $('showViewPanel');
            const showButtons = $('showButtons');
            const overviewTableBody = $('overviewTableBody');
            const showViewTableBody = $('showViewTableBody');
            const episodesCardsContainer = $('episodesCardsContainer');
            const panelTitle = $('panelTitle');
            const syncIndicator = $('syncIndicator');

            // ─── SUPABASE CLIENT ──────────────────────────────────────
            let supabaseClient = null;
            try {
                if (typeof window.supabase !== 'undefined' && typeof window.supabase.createClient === 'function') {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                        db: {
                            schema: 'CLASSICS'
                        }
                    });
                    console.log('✅ [SUPABASE] Client created with CLASSICS schema');
                } else {
                    console.warn('⚠️ [SUPABASE] Supabase library not loaded');
                }
            } catch (e) {
                console.warn('⚠️ [SUPABASE] Failed to create client:', e.message);
            }

            // ─── STATE ─────────────────────────────────────────────────
            let allShows = [];
            let allEpisodes = [];
            let weekendData = [];
            let turnoverData = [];
            let currentView = 'overview';
            let currentShowTitle = null;
            let currentShowObject = null;
            let editingCell = null;
            let calendarWeekOffset = 0;
            let sortField = 'air_date';
            let sortDir = 'asc';
            let episodeFilter = 'all';
            let episodeSearchTerm = '';
            let hideFinished = false;

            // ─── HELPERS ──────────────────────────────────────────────
            function setStatus(text, type) {
                const colors = { ok: 'status-ok', error: 'status-error', waiting: 'status-waiting' };
                const dots = { ok: 'green', error: 'red', waiting: 'amber' };
                statusBadge.className = `status-badge-top ${colors[type] || 'status-waiting'}`;
                statusBadge.innerHTML = `<span class="status-dot ${dots[type] || 'amber'}"></span>${text}`;
            }

            function showMessage(text, type) {
                messageArea.innerHTML = `
                    <div class="rounded-xl border px-3 sm:px-4 py-2 sm:py-3 text-xs sm:text-sm bg-mist border-slate-200 text-midnight flex items-center justify-between fade-in" style="margin-bottom:0.75rem;">
                        <span>${text}</span>
                        <button onclick="this.parentElement.remove()" style="background:none;border:none;color:inherit;margin-left:1rem;cursor:pointer;">✕</button>
                    </div>
                `;
                setTimeout(() => { if (messageArea.firstChild) messageArea.firstChild.remove(); }, 3000);
            }

            function esc(s) {
                if (s == null || s === '') return '—';
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function jsEscape(s) {
                return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
            }

            function formatDate(dateStr) {
                if (!dateStr || dateStr === '—') return '—';
                try {
                    const d = new Date(dateStr);
                    if (isNaN(d.getTime())) {
                        const d2 = new Date(dateStr + 'T00:00:00');
                        if (isNaN(d2.getTime())) return dateStr;
                        return d2.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                    }
                    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                } catch { return dateStr; }
            }

            function getShowIcon(title) {
                const icons = {
                    'CHARLIE CHAPLIN': 'fa-hat-wizard',
                    'I MARRIED JOAN': 'fa-ring',
                    'JOHNNY STACCATO': 'fa-microphone',
                    "LI'L HITLER": 'fa-mask',
                    'POPEYE CLASSIC': 'fa-anchor',
                    "WHAT'S MY LINE GAME SHOW": 'fa-gamepad'
                };
                return icons[title] || 'fa-tv';
            }

            function isOverdue(episode) {
                if (episode.status === true || episode.status === 'Done') return false;
                if (!episode.air_date) return false;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const airDate = new Date(episode.air_date);
                airDate.setHours(0, 0, 0, 0);
                return airDate < today;
            }

            function calculateAvailableUntil(showTitle) {
                const showEpisodes = allEpisodes.filter(ep => ep.show_title === showTitle);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const futureToAir = showEpisodes.filter(ep => {
                    if (ep.status === true || ep.status === 'Done') return false;
                    if (!ep.air_date) return false;
                    const airDate = new Date(ep.air_date);
                    airDate.setHours(0, 0, 0, 0);
                    return airDate >= today;
                });
                if (futureToAir.length === 0) return null;
                const latestDate = futureToAir.map(ep => ep.air_date).sort().pop();
                return latestDate;
            }

            function getShowProgress(showTitle) {
                const episodes = allEpisodes.filter(ep => ep.show_title === showTitle);
                const done = episodes.filter(ep => ep.status === true || ep.status === 'Done').length;
                const total = episodes.length;
                return { done, total };
            }

            function isShowFinished(showTitle) {
                const { done, total } = getShowProgress(showTitle);
                return total > 0 && done === total;
            }

            function updateSyncIndicator() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                syncIndicator.innerHTML = `<i class="fa-solid fa-cloud-arrow-up mr-1"></i>Synced ${timeStr}`;
            }

            // ─── AUTH ──────────────────────────────────────────────────
            async function checkSession() {
                setStatus('Checking...', 'waiting');
                if (!supabaseClient) { setStatus('⚠️ No Supabase', 'error'); return; }
                try {
                    const { data, error } = await supabaseClient.auth.getSession();
                    if (error) throw error;
                    const session = data?.session;
                    if (!session || !session.user) {
                        setStatus('🔓 Not logged in', 'error');
                        setTimeout(() => { window.location.href = '../index.html'; }, 1500);
                        return;
                    }
                    setStatus('✅ Connected', 'ok');
                    await loadAllData();
                } catch (err) { 
                    console.error('Session error:', err);
                    setStatus('❌ Error', 'error'); 
                }
            }

            // ─── LOAD DATA (FIXED) ──────────────────────────────────
            async function loadAllData() {
                if (!supabaseClient) return;
                try {
                    console.log('📊 [QUERY] Loading data from CLASSICS schema...');
                    
                    const [titlesRes, episodesRes, weekendRes, turnoversRes] = await Promise.all([
                        supabaseClient.schema('CLASSICS').from('classic_titles').select('*').order('title'),
                        supabaseClient.schema('CLASSICS').from('classic_episodes').select('*').order('air_date', { ascending: true }),
                        supabaseClient.schema('CLASSICS').from('classic_schedule').select('*').order('day'),
                        supabaseClient.schema('CLASSICS').from('classic_turnovers').select('*').order('start_date')
                    ]);
                    
                    if (titlesRes.error) throw titlesRes.error;
                    if (episodesRes.error) throw episodesRes.error;
                    if (weekendRes.error) throw weekendRes.error;
                    if (turnoversRes.error) throw turnoversRes.error;
                    
                    allShows = titlesRes.data || [];
                    allEpisodes = episodesRes.data || [];
                    weekendData = weekendRes.data || [];
                    turnoverData = turnoversRes.data || [];
                    
                    console.log('✅ [DATA] Loaded successfully:', {
                        shows: allShows.length,
                        episodes: allEpisodes.length,
                        schedule: weekendData.length,
                        turnovers: turnoverData.length
                    });
                    
                    renderSidebar();
                    renderOverview();
                    if (currentView === 'show' && currentShowTitle) {
                        currentShowObject = allShows.find(s => s.title === currentShowTitle) || null;
                        if (currentShowObject) renderShowView(currentShowTitle);
                        else switchView('overview');
                    }
                } catch (err) {
                    console.error('❌ [ERROR] Load error:', err);
                    setStatus('⚠️ Error', 'error');
                    showMessage('Failed to load data: ' + err.message, 'error');
                }
            }

            // ─── RENDER SIDEBAR ────────────────────────────────────
            function renderSidebar() {
                let filteredShows = allShows;
                if (hideFinished) {
                    filteredShows = allShows.filter(show => !isShowFinished(show.title));
                }
                
                if (!filteredShows.length) {
                    showButtons.innerHTML = '<div style="color:#68748A;font-size:0.65rem;padding:0.3rem 0.5rem;text-align:center;">—</div>';
                    return;
                }
                
                showButtons.innerHTML = filteredShows.map(show => {
                    const icon = getShowIcon(show.title);
                    return `
                        <button class="sidebar-item" onclick="switchView('show', '${jsEscape(show.title)}')" data-show-title="${esc(show.title)}">
                            <span class="icon"><i class="fa-solid ${icon}"></i></span>
                            <span class="tooltip">${esc(show.title)}</span>
                        </button>
                    `;
                }).join('');
            }

            // ─── TOGGLE HIDE FINISHED ────────────────────────────────
            window.toggleHideFinished = function() {
                hideFinished = !hideFinished;
                const toggle = document.getElementById('hideFinishedToggle');
                if (toggle) {
                    toggle.classList.toggle('active', hideFinished);
                }
                renderSidebar();
                renderOverview();
            };

            // ─── SWITCH VIEW ──────────────────────────────────────────
            window.switchView = function(view, showTitle) {
                currentView = view;
                document.querySelectorAll('.sidebar-item').forEach(btn => btn.classList.remove('active'));
                if (view === 'overview') {
                    $('overviewBtn').classList.add('active');
                    currentShowTitle = null;
                    currentShowObject = null;
                    overviewPanel.style.display = 'block';
                    showViewPanel.style.display = 'none';
                    panelTitle.textContent = 'Classic Movies';
                    renderOverview();
                } else if (view === 'show' && showTitle) {
                    currentShowTitle = showTitle;
                    currentShowObject = allShows.find(s => s.title === showTitle);
                    if (!currentShowObject) { showMessage('Show not found', 'error'); return; }
                    document.querySelectorAll(`.sidebar-item[data-show-title]`).forEach(btn => {
                        if (btn.dataset.showTitle === showTitle) btn.classList.add('active');
                    });
                    overviewPanel.style.display = 'none';
                    showViewPanel.style.display = 'block';
                    panelTitle.textContent = showTitle;
                    renderShowView(showTitle);
                }
            };

            // ─── RENDER OVERVIEW ──────────────────────────────────────
            function renderOverview() {
                let filteredShows = allShows;
                if (hideFinished) {
                    filteredShows = allShows.filter(show => !isShowFinished(show.title));
                }
                
                const totalShows = filteredShows.length;
                const availableUntilMap = {};
                filteredShows.forEach(show => { availableUntilMap[show.title] = calculateAvailableUntil(show.title); });
                
                let nextExpire = null;
                let nextExpireShow = null;
                Object.keys(availableUntilMap).forEach(title => {
                    const date = availableUntilMap[title];
                    if (date && (!nextExpire || date < nextExpire)) { nextExpire = date; nextExpireShow = title; }
                });
                $('statTotalShows').textContent = totalShows;
                $('statNextExpire').textContent = nextExpireShow && nextExpire ? `${nextExpireShow} — ${formatDate(nextExpire)}` : '—';

                if (!filteredShows.length) {
                    overviewTableBody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:1.5rem;color:#68748A;">No titles yet.</td></tr>';
                } else {
                    overviewTableBody.innerHTML = filteredShows.map(show => {
                        const availableUntil = availableUntilMap[show.title];
                        const { done, total } = getShowProgress(show.title);
                        const progressText = total > 0 ? `${done}/${total}` : '0/0';
                        const isComplete = total > 0 && done === total;
                        const progressDisplay = isComplete ? `${progressText} ✓` : progressText;
                        const progressClass = isComplete ? 'progress-complete' : 'progress-incomplete';
                        return `
                            <tr onclick="switchView('show', '${jsEscape(show.title)}')" class="fade-in">
                                <td style="font-weight:700;">${esc(show.title)}</td>
                                <td>${availableUntil ? formatDate(availableUntil) : '—'}</td>
                                <td style="text-align:right;font-weight:600;" class="${progressClass}">${progressDisplay}</td>
                            </tr>
                        `;
                    }).join('');
                }

                renderCalendar('calendarGrid');
                renderCompactSchedule('scheduleCompactContainer', weekendData);
                renderTurnovers('turnoversContainer', turnoverData);
                updateWeekLabel();
            }

            // ─── RENDER COMPACT SCHEDULE ──────────────────────────────
            function renderCompactSchedule(containerId, data) {
                const container = document.getElementById(containerId);
                if (!container) return;
                if (!data || !data.length) {
                    container.innerHTML = '<div style="padding:0.75rem;text-align:center;color:#68748A;">No schedule items</div>';
                    return;
                }
                container.innerHTML = data.map(item => `
                    <div class="schedule-item">
                        <span class="schedule-day">${esc(item.day || '—')}</span>
                        <span class="schedule-time">${esc(item.time_slot || '—')}</span>
                        <span class="schedule-title" title="${esc(item.title || '')}">${esc(item.title || '')}</span>
                    </div>
                `).join('');
            }

            // ─── RENDER CALENDAR ──────────────────────────────────────
            function renderCalendar(gridId) {
                const grid = document.getElementById(gridId);
                if (!grid) return;
                
                const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
                const today = new Date();
                const startOfWeek = new Date(today);
                startOfWeek.setDate(today.getDate() - today.getDay() + (today.getDay() === 0 ? -6 : 1) + (calendarWeekOffset * 7));
                
                const daysWithEvents = [];
                
                daysOfWeek.forEach((day, idx) => {
                    const date = new Date(startOfWeek);
                    date.setDate(startOfWeek.getDate() + idx);
                    const dateStr = date.toISOString().split('T')[0];
                    
                    const dayEpisodes = allEpisodes.filter(ep => {
                        if (!ep.air_date) return false;
                        try {
                            const airDate = new Date(ep.air_date);
                            return airDate.toISOString().split('T')[0] === dateStr;
                        } catch { return false; }
                    });
                    
                    if (dayEpisodes.length > 0) {
                        daysWithEvents.push({ day, date, episodes: dayEpisodes });
                    }
                });
                
                if (daysWithEvents.length === 0) {
                    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:1rem;color:#68748A;">No episodes this week</div>';
                    return;
                }
                
                grid.innerHTML = daysWithEvents.map(({ day, date, episodes }) => {
                    return `<div class="calendar-day has-events">
                        <div class="day-header">
                            <span>${day}</span>
                            <span>${date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</span>
                        </div>
                        <div class="day-body">
                            ${episodes.map(ep => {
                                return `<div class="cal-event">
                                    <div class="cal-event-title">${esc(ep.episode_name || 'Untitled')}</div>
                                    <div class="cal-event-show">${esc(ep.show_title)}</div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;
                }).join('');
                
                updateWeekLabel();
            }

            window.changeWeek = function(direction) {
                calendarWeekOffset += direction;
                renderCalendar('calendarGrid');
                updateWeekLabel();
            };
            
            function updateWeekLabel() {
                const today = new Date();
                const startOfWeek = new Date(today);
                startOfWeek.setDate(today.getDate() - today.getDay() + (today.getDay() === 0 ? -6 : 1) + (calendarWeekOffset * 7));
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);
                const weekLabel = document.getElementById('weekLabel');
                if (weekLabel) {
                    weekLabel.textContent = `${startOfWeek.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${endOfWeek.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
                }
            }

            // ─── RENDER TURNOVERS ─────────────────────────────────────
            function renderTurnovers(containerId, data) {
                const container = document.getElementById(containerId);
                if (!container) return;
                if (!data || !data.length) {
                    container.innerHTML = '<div style="padding:0.75rem;text-align:center;color:#68748A;">No turnovers</div>';
                    return;
                }
                
                const grouped = {};
                data.forEach(item => {
                    const key = item.title || 'Untitled';
                    if (!grouped[key]) grouped[key] = [];
                    grouped[key].push(item);
                });
                
                let html = '';
                let index = 0;
                Object.keys(grouped).forEach(showTitle => {
                    const items = grouped[showTitle];
                    items.forEach(item => {
                        if (index > 0) html += `<hr style="border:none;border-top:1px solid rgba(255,255,255,0.1);margin:0.5rem 0;">`;
                        
                        const startDate = item.start_date ? formatDate(item.start_date) : '—';
                        const endDate = item.end_date ? formatDate(item.end_date) : '—';
                        
                        html += `
                            <div style="padding:0.75rem;background:rgba(255,255,255,0.03);border-radius:8px;margin-bottom:0.5rem;">
                                <div style="font-weight:600;margin-bottom:0.25rem;">${esc(showTitle)}</div>
                                <div style="color:#68748A;font-size:0.875rem;">
                                    ${startDate} — ${endDate}
                                    ${item.notes ? `<span style="margin-left:0.5rem;">${esc(item.notes)}</span>` : ''}
                                </div>
                            </div>
                        `;
                        index++;
                    });
                });
                container.innerHTML = html;
            }

            // ─── RENDER SHOW VIEW ─────────────────────────────────────
            function renderShowView(showTitle) {
                const show = allShows.find(s => s.title === showTitle);
                if (!show) { showMessage('Show not found', 'error'); return; }
                $('showViewTitle').textContent = show.title;
                const showEpisodes = allEpisodes.filter(ep => ep.show_title === showTitle);
                const done = showEpisodes.filter(ep => ep.status === true || ep.status === 'Done').length;
                const total = showEpisodes.length;
                const percent = total > 0 ? Math.round((done / total) * 100) : 0;
                const availableUntil = calculateAvailableUntil(showTitle);
                $('showViewInfo').innerHTML = `<span style="display:flex;align-items:center;gap:0.5rem;"><i class="fa-regular fa-calendar" style="color:#B8734F;"></i> Available Until: <strong>${availableUntil ? formatDate(availableUntil) : 'No upcoming episodes'}</strong></span>`;
                $('showViewCount').textContent = `${done}/${total}`;
                $('showViewProgressFill').style.width = `${percent}%`;
                $('episodeCountBadge').textContent = `${total} total`;
                renderEpisodes(showEpisodes);
                const filteredSchedule = weekendData.filter(item => item.title && item.title.toLowerCase() === showTitle.toLowerCase());
                renderShowSchedule('showScheduleItems', filteredSchedule);
                const filteredTurnovers = turnoverData.filter(item => item.title && item.title.toLowerCase() === showTitle.toLowerCase());
                renderEditableTurnovers('showTurnoversContainer', filteredTurnovers);
            }

            // ─── EPISODES RENDERING ───────────────────────────────────
            function renderEpisodes(episodes) {
                let filtered = episodes;
                if (episodeFilter === 'done') filtered = filtered.filter(ep => ep.status === true || ep.status === 'Done');
                else if (episodeFilter === 'toair') filtered = filtered.filter(ep => (ep.status !== true && ep.status !== 'Done') && !isOverdue(ep));
                else if (episodeFilter === 'overdue') filtered = filtered.filter(ep => isOverdue(ep));
                if (episodeSearchTerm) {
                    const term = episodeSearchTerm.toLowerCase();
                    filtered = filtered.filter(ep => 
                        (ep.episode_name || '').toLowerCase().includes(term) || 
                        (ep.air_date || '').toLowerCase().includes(term)
                    );
                }
                filtered.sort((a, b) => {
                    let valA, valB;
                    if (sortField === 'air_date') { valA = a.air_date || ''; valB = b.air_date || ''; }
                    else if (sortField === 'episode_name') { valA = a.episode_name || ''; valB = b.episode_name || ''; }
                    else if (sortField === 'status') {
                        valA = a.status === true || a.status === 'Done' ? 'done' : (isOverdue(a) ? 'overdue' : 'toair');
                        valB = b.status === true || b.status === 'Done' ? 'done' : (isOverdue(b) ? 'overdue' : 'toair');
                    }
                    if (valA < valB) return sortDir === 'asc' ? -1 : 1;
                    if (valA > valB) return sortDir === 'asc' ? 1 : -1;
                    return 0;
                });

                const totalEpisodes = episodes.length;
                const doneCount = episodes.filter(ep => ep.status === true || ep.status === 'Done').length;
                const overdueCount = episodes.filter(ep => isOverdue(ep)).length;
                const toairCount = totalEpisodes - doneCount - overdueCount;
                document.getElementById('countAll').textContent = totalEpisodes;
                document.getElementById('countDone').textContent = doneCount;
                document.getElementById('countToAir').textContent = toairCount;
                document.getElementById('countOverdue').textContent = overdueCount;

                if (!filtered.length) {
                    showViewTableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:1.5rem;color:#68748A;">No episodes match.</td></tr>';
                } else {
                    showViewTableBody.innerHTML = filtered.map(ep => {
                        const overdue = isOverdue(ep);
                        const statusClass = ep.status === true || ep.status === 'Done' ? 'badge-done' : (overdue ? 'badge-overdue' : 'badge-toair');
                        const statusText = ep.status === true || ep.status === 'Done' ? 'Done' : (overdue ? 'Overdue' : 'To Air');
                        return `
                            <tr data-episode-id="${ep.id}" class="fade-in">
                                <td onclick="editCell(this, 'air_date', '${ep.id}')" class="editable-cell" title="Click to edit">${esc(ep.air_date || '—')} <span class="edit-icon">✏️</span></td>
                                <td onclick="editCell(this, 'episode_name', '${ep.id}')" class="editable-cell" title="${esc(ep.episode_name || '')}">${esc(ep.episode_name || '—')} <span class="edit-icon">✏️</span></td>
                                <td style="text-align:center;" onclick="toggleStatus('${ep.id}', ${ep.status === true || ep.status === 'Done'})" style="cursor:pointer;"><span class="${statusClass}">${statusText}</span></td>
                                <td style="text-align:center;"><button class="btn-delete-episode" onclick="deleteEpisode('${ep.id}')" title="Delete"><i class="fa-solid fa-trash-can"></i></button></td>
                            </tr>
                        `;
                    }).join('');
                }
            }

            // ─── FILTER & SEARCH EPISODES ────────────────────────────
            window.filterEpisodes = function(filter) {
                episodeFilter = filter;
                document.querySelectorAll('.filter-pill').forEach(pill => pill.classList.remove('active'));
                document.querySelector(`.filter-pill[data-filter="${filter}"]`).classList.add('active');
                if (currentShowTitle) renderShowView(currentShowTitle);
            };
            
            window.sortEpisodesBy = function(field) {
                if (sortField === field) {
                    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
                } else {
                    sortField = field;
                    sortDir = 'asc';
                }
                if (currentShowTitle) renderShowView(currentShowTitle);
            };

            // ─── ADD EPISODE ─────────────────────────────────────────
            window.addEpisode = async function() {
                if (!currentShowTitle) return;
                try {
                    const { data, error } = await supabaseClient
                        .schema('CLASSICS')
                        .from('classic_episodes')
                        .insert({ show_title: currentShowTitle, air_date: null, episode_name: 'New Episode', status: false })
                        .select();
                    if (error) throw error;
                    if (data && data[0]) allEpisodes.push(data[0]);
                    showMessage('✅ Episode added', 'success');
                    if (currentShowTitle) renderShowView(currentShowTitle);
                } catch (err) {
                    showMessage('❌ ' + err.message, 'error');
                }
            };

            // ─── DELETE EPISODE ──────────────────────────────────────
            window.deleteEpisode = async function(episodeId) {
                if (!confirm('Delete this episode?')) return;
                try {
                    const { error } = await supabaseClient
                        .schema('CLASSICS')
                        .from('classic_episodes')
                        .delete()
                        .eq('id', episodeId);
                    if (error) throw error;
                    allEpisodes = allEpisodes.filter(ep => ep.id != episodeId);
                    showMessage('✅ Episode deleted', 'success');
                    if (currentShowTitle) renderShowView(currentShowTitle);
                } catch (err) {
                    showMessage('❌ ' + err.message, 'error');
                }
            };

            // ─── TOGGLE STATUS ───────────────────────────────────────
            window.toggleStatus = async function(episodeId, currentStatus) {
                const newStatus = !currentStatus;
                try {
                    const { error } = await supabaseClient
                        .schema('CLASSICS')
                        .from('classic_episodes')
                        .update({ status: newStatus })
                        .eq('id', episodeId);
                    if (error) throw error;
                    const ep = allEpisodes.find(e => e.id == episodeId);
                    if (ep) ep.status = newStatus;
                    showMessage('✅ Status updated', 'success');
                    if (currentShowTitle) renderShowView(currentShowTitle);
                } catch (err) {
                    showMessage('❌ ' + err.message, 'error');
                }
            };

            // ─── EDIT CELL ──────────────────────────────────────────
            window.editCell = function(td, field, episodeId) {
                if (editingCell) return;
                const currentValue = td.textContent.replace('✏️', '').trim();
                const input = document.createElement('input');
                input.type = 'text';
                input.value = currentValue === '—' ? '' : currentValue;
                input.className = 'edit-input';
                td.textContent = '';
                td.appendChild(input);
                input.focus();
                input.select();
                editingCell = { td, field, episodeId, oldValue: currentValue };
                input.addEventListener('blur', function() { saveEdit(td, field, episodeId, input.value); });
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') { e.preventDefault(); saveEdit(td, field, episodeId, input.value); }
                    if (e.key === 'Escape') { td.textContent = editingCell.oldValue === '' ? '—' : editingCell.oldValue; editingCell = null; }
                });
            };

            async function saveEdit(td, field, episodeId, newValue) {
                if (!editingCell) return;
                const oldValue = editingCell.oldValue;
                editingCell = null;
                const finalValue = newValue.trim() || '—';
                if (finalValue === oldValue) { td.textContent = oldValue; return; }
                td.textContent = finalValue;
                try {
                    const updateData = {};
                    if (field === 'air_date') updateData.air_date = finalValue === '—' ? null : finalValue;
                    else if (field === 'episode_name') updateData.episode_name = finalValue === '—' ? '' : finalValue;
                    const { error } = await supabaseClient
                        .schema('CLASSICS')
                        .from('classic_episodes')
                        .update(updateData)
                        .eq('id', episodeId);
                    if (error) throw error;
                    const ep = allEpisodes.find(e => e.id == episodeId);
                    if (ep) {
                        if (field === 'air_date') ep.air_date = finalValue === '—' ? null : finalValue;
                        else if (field === 'episode_name') ep.episode_name = finalValue === '—' ? '' : finalValue;
                    }
                    showMessage('✅ Updated', 'success');
                    if (currentShowTitle) renderShowView(currentShowTitle);
                } catch (err) {
                    showMessage('❌ ' + err.message, 'error');
                    td.textContent = oldValue;
                }
            }

            // ─── SCHEDULE ────────────────────────────────────────────
            function renderShowSchedule(containerId, data) {
                const container = document.getElementById(containerId);
                if (!container) return;
                if (!data || !data.length) {
                    container.innerHTML = '<div style="padding:0.75rem;text-align:center;color:#68748A;">No schedule items</div>';
                    return;
                }
                container.innerHTML = data.map(item => `
                    <div class="schedule-item">
                        <span class="editable-cell schedule-day" onclick="editScheduleDay(this, '${item.id}')" style="cursor:pointer;min-width:90px;">
                            ${esc(item.day || '—')} <span class="edit-icon">✏️</span>
                        </span>
                        <span class="editable-cell schedule-time" onclick="editScheduleTime(this, '${item.id}')" style="cursor:pointer;min-width:130px;">
                            ${esc(item.time_slot || '—')} <span class="edit-icon">✏️</span>
                        </span>
                        <span class="schedule-title">${esc(item.title || '')}</span>
                        <button class="btn-delete-episode" onclick="deleteScheduleItem('${item.id}')" style="margin-left:auto;"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `).join('');
            }

            window.editScheduleDay = function(el, scheduleId) {
                if (editingCell) return;
                const currentValue = el.textContent.replace('✏️', '').trim();
                const select = document.createElement('select');
                select.className = 'edit-input';
                const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
                days.forEach(day => {
                    const opt = document.createElement('option');
                    opt.value = day; opt.textContent = day;
                    if (day === currentValue) opt.selected = true;
                    select.appendChild(opt);
                });
                el.textContent = ''; el.appendChild(select); select.focus();
                editingCell = { el, scheduleId, oldValue: currentValue, type: 'scheduleDay' };
                select.addEventListener('change', function() { saveScheduleDay(el, scheduleId, select.value); });
                select.addEventListener('blur', function() { saveScheduleDay(el, scheduleId, select.value); });
                select.addEventListener('keydown', function(e) { if (e.key === 'Escape') { el.textContent = currentValue; editingCell = null; } });
            };

            window.editScheduleTime = function(el, scheduleId) {
                if (editingCell) return;
                const currentValue = el.textContent.replace('✏️', '').trim();
                const input = document.createElement('input');
                input.type = 'text'; input.value = currentValue === '—' ? '' : currentValue;
                input.placeholder = 'e.g., 4:00PM - 4:30PM'; input.className = 'edit-input';
                el.textContent = ''; el.appendChild(input); input.focus(); input.select();
                editingCell = { el, scheduleId, oldValue: currentValue, type: 'scheduleTime' };
                input.addEventListener('blur', function() { saveScheduleTime(el, scheduleId, input.value); });
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') { e.preventDefault(); saveScheduleTime(el, scheduleId, input.value); }
                    if (e.key === 'Escape') { el.textContent = currentValue === '' ? '—' : currentValue; editingCell = null; }
                });
            };

            async function saveScheduleDay(el, scheduleId, newValue) {
                if (!editingCell) return;
                const oldValue = editingCell.oldValue; editingCell = null;
                if (newValue === oldValue) { el.textContent = oldValue; return; }
                el.textContent = newValue;
                try {
                    const { error } = await supabaseClient
                        .schema('CLASSICS')
                        .from('classic_schedule')
                        .update({ day: newValue })
                        .eq('id', scheduleId);
                    if (error) throw error;
                    const sched = weekendData.find(s => s.id == scheduleId);
                    if (sched) sched.day = newValue;
                    showMessage('✅ Updated', 'success');
                    if (currentShowTitle) renderShowView(currentShowTitle);
                } catch (err) {
                    showMessage('❌ ' + err.message, 'error');
                    el.textContent = oldValue;
                }
            }
            
            async function saveScheduleTime(el, scheduleId, newValue) {
                if (!editingCell) return;
                const oldValue = editingCell.oldValue; editingCell = null;
                const finalValue = newValue.trim() || '—';
                if (finalValue === oldValue) { el.textContent = oldValue; return; }
                el.textContent = finalValue;
                try {
                    const { error } = await supabaseClient
                        .schema('CLASSICS')
                        .from('classic_schedule')
                        .update({ time_slot: finalValue === '—' ? '' : finalValue })
                        .eq('id', scheduleId);
                    if (error) throw error;
                    const sched = weekendData.find(s => s.id == scheduleId);
                    if (sched) sched.time_slot = finalValue === '—' ? '' : finalValue;
                    showMessage('✅ Updated', 'success');
                    if (currentShowTitle) renderShowView(currentShowTitle);
                } catch (err) {
                    showMessage('❌ ' + err.message, 'error');
                    el.textContent = oldValue;
                }
            }

            window.addScheduleItem = async function() {
                if (!currentShowTitle) return;
                try {
                    const { data, error } = await supabaseClient
                        .schema('CLASSICS')
                        .from('classic_schedule')
                        .insert({ title: currentShowTitle, day: 'Monday', time_slot: '' })
                        .select();
                    if (error) throw error;
                    if (data && data[0]) weekendData.push(data[0]);
                    showMessage('✅ Schedule added', 'success');
                    if (currentShowTitle) renderShowView(currentShowTitle);
                } catch (err) { showMessage('❌ ' + err.message, 'error'); }
            };
            
            window.deleteScheduleItem = async function(id) {
                if (!confirm('Delete this schedule item?')) return;
                try {
                    const { error } = await supabaseClient
                        .schema('CLASSICS')
                        .from('classic_schedule')
                        .delete()
                        .eq('id', id);
                    if (error) throw error;
                    weekendData = weekendData.filter(s => s.id != id);
                    showMessage('✅ Deleted', 'success');
                    if (currentShowTitle) renderShowView(currentShowTitle);
                } catch (err) { showMessage('❌ ' + err.message, 'error'); }
            };

            // ─── TURNOVERS (Editable) ───────────────────────────────
            function renderEditableTurnovers(containerId, data) {
                const container = document.getElementById(containerId);
                if (!container) return;
                if (!data || !data.length) {
                    container.innerHTML = '<div style="padding:0.75rem;text-align:center;color:#68748A;">No turnovers</div>';
                    return;
                }
                
                let html = '';
                data.forEach((item, index) => {
                    if (index > 0) html += `<hr style="border:none;border-top:1px solid rgba(255,255,255,0.1);margin:0.5rem 0;">`;
                    
                    const startDate = item.start_date ? formatDate(item.start_date) : '—';
                    const endDate = item.end_date ? formatDate(item.end_date) : '—';
                    
                    html += `
                        <div style="padding:1rem;background:rgba(255,255,255,0.03);border-radius:8px;margin-bottom:0.5rem;">
                            <div class="editable-cell" onclick="editTurnoverCell(this, 'title', '${item.id}')" style="cursor:pointer;font-weight:600;margin-bottom:0.25rem;">
                                ${esc(item.title)} <span class="edit-icon">✏️</span>
                            </div>
                            <div class="editable-cell" onclick="editTurnoverCell(this, 'dates', '${item.id}')" style="cursor:pointer;color:#68748A;font-size:0.875rem;">
                                ${startDate} — ${endDate}
                                ${item.notes ? `<span style="margin-left:0.5rem;">${esc(item.notes)}</span>` : ''}
                                <span class="edit-icon">✏️</span>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            window.editTurnoverCell = function(el, field, id) {
                if (editingCell) return;
                let currentValue = el.textContent.replace('✏️', '').trim();
                const input = document.createElement('input');
                input.type = 'text'; 
                input.value = currentValue === '—' ? '' : currentValue;
                input.className = 'edit-input';
                el.textContent = ''; 
                el.appendChild(input); 
                input.focus(); 
                input.select();
                editingCell = { el, field, id, oldValue: currentValue || '—' };
                input.addEventListener('blur', function() { saveTurnoverEdit(el, field, id, input.value); });
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') { e.preventDefault(); saveTurnoverEdit(el, field, id, input.value); }
                    if (e.key === 'Escape') { el.textContent = editingCell.oldValue === '' ? '—' : editingCell.oldValue; editingCell = null; }
                });
            };

            async function saveTurnoverEdit(el, field, id, newValue) {
                if (!editingCell) return;
                const oldValue = editingCell.oldValue;
                editingCell = null;
                const finalValue = newValue.trim() || '—';
                if (finalValue === oldValue) { el.textContent = finalValue; return; }
                el.textContent = finalValue;
                try {
                    const updateData = {};
                    if (field === 'title') updateData.title = finalValue === '—' ? '' : finalValue;
                    else if (field === 'dates') {
                        const parts = finalValue.split('—').map(s => s.trim());
                        updateData.start_date = parts[0] && parts[0] !== '—' ? parts[0] : null;
                        updateData.end_date = parts[1] && parts[1] !== '—' ? parts[1] : null;
                    }
                    const { error } = await supabaseClient
                        .schema('CLASSICS')
                        .from('classic_turnovers')
                        .update(updateData)
                        .eq('id', id);
                    if (error) throw error;
                    const turnover = turnoverData.find(t => t.id == id);
                    if (turnover) {
                        if (field === 'title') turnover.title = updateData.title;
                        else if (field === 'dates') {
                            turnover.start_date = updateData.start_date;
                            turnover.end_date = updateData.end_date;
                        }
                    }
                    showMessage('✅ Updated', 'success');
                    if (currentShowTitle) renderShowView(currentShowTitle);
                } catch (err) {
                    showMessage('❌ ' + err.message, 'error');
                    el.textContent = oldValue;
                }
            }

            window.addTurnover = async function() {
                if (!currentShowTitle) return;
                try {
                    const { data, error } = await supabaseClient
                        .schema('CLASSICS')
                        .from('classic_turnovers')
                        .insert({ title: currentShowTitle, start_date: null, end_date: null, notes: '' })
                        .select();
                    if (error) throw error;
                    if (data && data[0]) turnoverData.push(data[0]);
                    showMessage('✅ Turnover added', 'success');
                    if (currentShowTitle) renderShowView(currentShowTitle);
                } catch (err) { showMessage('❌ ' + err.message, 'error'); }
            };

            window.deleteTurnover = async function(id) {
                if (!confirm('Delete this turnover?')) return;
                try {
                    const { error } = await supabaseClient
                        .schema('CLASSICS')
                        .from('classic_turnovers')
                        .delete()
                        .eq('id', id);
                    if (error) throw error;
                    turnoverData = turnoverData.filter(t => t.id != id);
                    showMessage('✅ Deleted', 'success');
                    if (currentShowTitle) renderShowView(currentShowTitle);
                } catch (err) { showMessage('❌ ' + err.message, 'error'); }
            };

            // ─── GLOBAL SEARCH ────────────────────────────────────────
            window.handleGlobalSearch = function(query) {
                const q = query.trim().toLowerCase();
                document.querySelectorAll('#showButtons .sidebar-item').forEach(btn => {
                    const title = btn.dataset.showTitle?.toLowerCase() || '';
                    btn.style.display = title.includes(q) ? '' : 'none';
                });
            };
            
            window.clearSearch = function() {
                const input = document.getElementById('globalSearchInput');
                input.value = '';
                handleGlobalSearch('');
                input.focus();
            };

            // ─── ADD NEW SHOW ───────────────────────────────────────
            window.addNewShow = async function() {
                const showName = prompt('Enter show name:');
                if (!showName) return;
                try {
                    const { data, error } = await supabaseClient
                        .schema('CLASSICS')
                        .from('classic_titles')
                        .insert({ title: showName.trim(), status: 'Active' })
                        .select();
                    if (error) throw error;
                    if (data && data[0]) allShows.push(data[0]);
                    showMessage('✅ Show added', 'success');
                    renderSidebar();
                    if (data && data[0]) switchView('show', data[0].title);
                } catch (err) { showMessage('❌ ' + err.message, 'error'); }
            };

            // ─── KEYBOARD SHORTCUTS ──────────────────────────────────
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && editingCell) {
                    const { el, oldValue } = editingCell;
                    el.textContent = oldValue === '' ? '—' : oldValue;
                    editingCell = null;
                    e.preventDefault();
                }
            });

            // ─── INIT ────────────────────────────────────────────────
            document.addEventListener('DOMContentLoaded', function() {
                updateSyncIndicator();
                setInterval(updateSyncIndicator, 60000);
                if (supabaseClient) checkSession();
                else setStatus('⚠️ No Supabase', 'error');
            });

            console.log('🎬 [CLASSIC MOVIES] Successfully initialized with CLASSICS schema!');
        })();
    </script>
</body>
</html>
