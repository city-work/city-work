<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Movies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <style>
        /* ─── CSS RESET & BASE ─────────────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #18202F;
            color: #FAF7F2;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ─── LAYOUT ────────────────────────────────────────────── */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* ─── SIDEBAR ───────────────────────────────────────────── */
        .sidebar {
            width: 80px;
            background: rgba(24, 32, 47, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            position: fixed;
            height: 100vh;
            z-index: 50;
            backdrop-filter: blur(20px);
        }

        .sidebar-item {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: transparent;
            border: none;
            color: #68748A;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-item:hover {
            background: rgba(184, 115, 79, 0.15);
            color: #B8734F;
            transform: translateY(-2px);
        }

        .sidebar-item.active {
            background: #B8734F;
            color: #FAF7F2;
            box-shadow: 0 8px 25px rgba(184, 115, 79, 0.3);
        }

        .sidebar-item .icon {
            font-size: 1.5rem;
        }

        .sidebar-item .tooltip {
            position: absolute;
            left: 70px;
            top: 50%;
            transform: translateY(-50%);
            background: #18202F;
            color: #FAF7F2;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-item:hover .tooltip {
            opacity: 1;
            left: 75px;
        }

        /* ─── MAIN CONTENT ──────────────────────────────────────── */
        .main-content {
            flex: 1;
            margin-left: 80px;
            padding: 1.5rem;
            max-width: calc(100% - 80px);
        }

        /* ─── TOP BAR ───────────────────────────────────────────── */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #FAF7F2;
            font-size: 0.875rem;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #B8734F;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(184, 115, 79, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #68748A;
        }

        .status-badge-top {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.green { background: #10B981; }
        .status-dot.red { background: #EF4444; }
        .status-dot.amber { background: #F59E0B; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ─── PANELS ────────────────────────────────────────────── */
        .panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #FAF7F2;
        }

        /* ─── STATS GRID ────────────────────────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.25rem;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .stat-label {
            font-size: 0.75rem;
            color: #68748A;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #FAF7F2;
        }

        /* ─── TABLE STYLES ──────────────────────────────────────── */
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        thead {
            background: rgba(255, 255, 255, 0.05);
        }

        th {
            padding: 0.875rem 1rem;
            text-align: left;
            font-weight: 600;
            color: #68748A;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            color: #B8734F;
        }

        td {
            padding: 0.875rem 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        tbody tr {
            cursor: pointer;
            transition: all 0.2s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* ─── BADGES ────────────────────────────────────────────── */
        .badge-done {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.2);
            color: #10B981;
        }

        .badge-overdue {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.2);
            color: #EF4444;
        }

        .badge-toair {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(59, 130, 246, 0.2);
            color: #3B82F6;
        }

        .progress-complete {
            color: #10B981;
        }

        .progress-incomplete {
            color: #F59E0B;
        }

        /* ─── BUTTONS ───────────────────────────────────────────── */
        .btn-primary {
            padding: 0.625rem 1.25rem;
            background: #B8734F;
            color: #FAF7F2;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.875rem;
        }

        .btn-primary:hover {
            background: #A05F3D;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(184, 115, 79, 0.3);
        }

        .btn-delete-episode {
            background: transparent;
            border: none;
            color: #EF4444;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .btn-delete-episode:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* ─── EDITABLE CELLS ────────────────────────────────────── */
        .editable-cell {
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }

        .editable-cell:hover {
            background: rgba(184, 115, 79, 0.1);
        }

        .edit-icon {
            opacity: 0;
            font-size: 0.75rem;
            margin-left: 0.25rem;
            transition: opacity 0.2s;
        }

        .editable-cell:hover .edit-icon {
            opacity: 1;
        }

        .edit-input {
            width: 100%;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #B8734F;
            border-radius: 6px;
            color: #FAF7F2;
            font-size: 0.875rem;
        }

        .edit-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(184, 115, 79, 0.2);
        }

        /* ─── CALENDAR ──────────────────────────────────────────── */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .calendar-day {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1rem;
        }

        .calendar-day.has-events {
            border: 1px solid rgba(184, 115, 79, 0.3);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .cal-event {
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cal-event:hover {
            background: rgba(184, 115, 79, 0.1);
        }

        .cal-event-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .cal-event-show {
            font-size: 0.75rem;
            color: #68748A;
        }

        /* ─── SCHEDULE ITEMS ────────────────────────────────────── */
        .schedule-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: all 0.2s;
        }

        .schedule-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .schedule-day {
            font-weight: 600;
            color: #B8734F;
            min-width: 80px;
        }

        .schedule-time {
            color: #68748A;
            min-width: 120px;
        }

        .schedule-title {
            flex: 1;
            font-weight: 500;
        }

        /* ─── TURNOVERS ─────────────────────────────────────────── */
        .turnover-item {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .turnover-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .turnover-dates {
            color: #68748A;
            font-size: 0.875rem;
        }

        .turnover-divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin: 0.5rem 0;
        }

        /* ─── RESPONSIVE ────────────────────────────────────────── */
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }

            .sidebar-item {
                width: 45px;
                height: 45px;
                border-radius: 12px;
            }

            .sidebar-item .icon {
                font-size: 1.25rem;
            }

            .main-content {
                margin-left: 60px;
                padding: 1rem;
                max-width: calc(100% - 60px);
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-container {
                max-width: 100%;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ─── ANIMATIONS ────────────────────────────────────────── */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ─── FILTER PILLS ──────────────────────────────────────── */
        .filter-pills {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .filter-pill {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            color: #68748A;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .filter-pill:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .filter-pill.active {
            background: #B8734F;
            color: #FAF7F2;
            border-color: #B8734F;
        }

        /* ─── TOGGLE ────────────────────────────────────────────── */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
        }

        .toggle-switch {
            width: 40px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            position: relative;
            transition: all 0.3s;
        }

        .toggle-switch.active {
            background: #B8734F;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }

        .toggle-switch.active::after {
            left: 22px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- ─── SIDEBAR ────────────────────────────────────────── -->
        <aside class="sidebar">
            <button class="sidebar-item active" id="overviewBtn" onclick="switchView('overview')">
                <span class="icon"><i class="fa-solid fa-house"></i></span>
                <span class="tooltip">Overview</span>
            </button>
            <div id="showButtons" style="display:flex;flex-direction:column;gap:0.5rem;margin-top:1rem;"></div>
            <button class="sidebar-item" onclick="addNewShow()" style="margin-top:auto;">
                <span class="icon"><i class="fa-solid fa-plus"></i></span>
                <span class="tooltip">Add Show</span>
            </button>
        </aside>

        <!-- ─── MAIN CONTENT ───────────────────────────────────── -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="search-container">
                    <i class="fa-solid fa-search search-icon"></i>
                    <input type="text" class="search-input" id="globalSearchInput" placeholder="Search shows..." oninput="handleGlobalSearch(this.value)">
                    <button id="searchClear" onclick="clearSearch()" style="display:none;position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#68748A;cursor:pointer;">✕</button>
                </div>
                <div class="status-badge-top" id="statusBadge">
                    <span class="status-dot amber"></span>
                    <span>Loading...</span>
                </div>
            </div>

            <!-- Message Area -->
            <div id="messageArea"></div>

            <!-- Sync Indicator -->
            <div id="syncIndicator" style="text-align:right;font-size:0.75rem;color:#68748A;margin-bottom:1rem;"></div>

            <!-- Overview Panel -->
            <div id="overviewPanel">
                <h1 class="panel-title" id="panelTitle">Classic Movies</h1>
                
                <!-- Stats Grid -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Shows</div>
                        <div class="stat-value" id="statTotalShows">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Next Expiring</div>
                        <div class="stat-value" id="statNextExpire" style="font-size:1rem;">—</div>
                    </div>
                </div>

                <!-- Toggle Hide Finished -->
                <div class="toggle-container" style="margin-bottom:1rem;" onclick="toggleHideFinished()">
                    <div class="toggle-switch" id="hideFinishedToggle"></div>
                    <span style="font-size:0.875rem;">Hide Finished Shows</span>
                </div>

                <!-- Overview Table -->
                <div class="table-container" style="margin-bottom:1.5rem;">
                    <table>
                        <thead>
                            <tr>
                                <th>Show Title</th>
                                <th>Available Until</th>
                                <th style="text-align:right;">Progress</th>
                            </tr>
                        </thead>
                        <tbody id="overviewTableBody"></tbody>
                    </table>
                </div>

                <!-- Calendar -->
                <div class="panel" style="margin-bottom:1.5rem;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
                        <h3 style="font-size:1.125rem;font-weight:700;">This Week</h3>
                        <div style="display:flex;gap:0.5rem;">
                            <button class="btn-primary" onclick="changeWeek(-1)" style="padding:0.5rem 1rem;">←</button>
                            <span id="weekLabel" style="font-size:0.875rem;align-self:center;"></span>
                            <button class="btn-primary" onclick="changeWeek(1)" style="padding:0.5rem 1rem;">→</button>
                        </div>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                </div>

                <!-- Schedule -->
                <div class="panel" style="margin-bottom:1.5rem;">
                    <h3 style="font-size:1.125rem;font-weight:700;margin-bottom:1rem;">Schedule</h3>
                    <div id="scheduleCompactContainer"></div>
                </div>

                <!-- Turnovers -->
                <div class="panel">
                    <h3 style="font-size:1.125rem;font-weight:700;margin-bottom:1rem;">Turnovers</h3>
                    <div id="turnoversContainer"></div>
                </div>
            </div>

            <!-- Show View Panel -->
            <div id="showViewPanel" style="display:none;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
                    <h1 class="panel-title" id="showViewTitle" style="margin-bottom:0;"></h1>
                    <button class="btn-primary" onclick="switchView('overview')">← Back</button>
                </div>
                
                <div id="showViewInfo" style="margin-bottom:1rem;"></div>
                
                <div style="display:flex;gap:2rem;align-items:center;margin-bottom:1.5rem;">
                    <div style="flex:1;">
                        <div style="display:flex;justify-content:space-between;margin-bottom:0.5rem;">
                            <span style="font-size:0.875rem;color:#68748A;">Progress</span>
                            <span id="showViewCount" style="font-weight:600;">0/0</span>
                        </div>
                        <div style="height:8px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;">
                            <div id="showViewProgressFill" style="height:100%;background:#B8734F;width:0%;transition:width 0.3s;"></div>
                        </div>
                    </div>
                    <span id="episodeCountBadge" style="font-size:0.875rem;color:#68748A;">0 total</span>
                </div>

                <!-- Episode Filters -->
                <div class="filter-pills">
                    <button class="filter-pill active" data-filter="all" onclick="filterEpisodes('all')">All</button>
                    <button class="filter-pill" data-filter="done" onclick="filterEpisodes('done')">Done</button>
                    <button class="filter-pill" data-filter="toair" onclick="filterEpisodes('toair')">To Air</button>
                    <button class="filter-pill" data-filter="overdue" onclick="filterEpisodes('overdue')">Overdue</button>
                </div>

                <!-- Episode Counts -->
                <div style="display:flex;gap:1rem;margin-bottom:1rem;font-size:0.875rem;">
                    <span>All: <strong id="countAll">0</strong></span>
                    <span>Done: <strong id="countDone" style="color:#10B981;">0</strong></span>
                    <span>To Air: <strong id="countToAir" style="color:#3B82F6;">0</strong></span>
                    <span>Overdue: <strong id="countOverdue" style="color:#EF4444;">0</strong></span>
                </div>

                <!-- Add Episode Button -->
                <button class="btn-primary" onclick="addEpisode()" style="margin-bottom:1.5rem;">
                    <i class="fa-solid fa-plus mr-2"></i> Add Episode
                </button>

                <!-- Episodes Table -->
                <div class="table-container" style="margin-bottom:1.5rem;">
                    <table>
                        <thead>
                            <tr>
                                <th class="sortable" data-sort="air_date" onclick="sortEpisodesBy('air_date')">
                                    Air Date <i class="fa-solid fa-sort"></i>
                                </th>
                                <th class="sortable" data-sort="episode_name" onclick="sortEpisodesBy('episode_name')">
                                    Episode Name <i class="fa-solid fa-sort"></i>
                                </th>
                                <th class="sortable" data-sort="status" onclick="sortEpisodesBy('status')" style="text-align:center;">
                                    Status <i class="fa-solid fa-sort"></i>
                                </th>
                                <th style="text-align:center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="showViewTableBody"></tbody>
                    </table>
                </div>

                <!-- Episodes Cards (Mobile) -->
                <div id="episodesCardsContainer" style="display:none;"></div>

                <!-- Schedule -->
                <div class="panel" style="margin-bottom:1.5rem;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
                        <h3 style="font-size:1.125rem;font-weight:700;">Schedule</h3>
                        <button class="btn-primary" onclick="addScheduleItem()" style="padding:0.5rem 1rem;">Add</button>
                    </div>
                    <div id="showScheduleItems"></div>
                </div>

                <!-- Turnovers -->
                <div class="panel">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
                        <h3 style="font-size:1.125rem;font-weight:700;">Turnovers</h3>
                        <button class="btn-primary" onclick="addTurnover()" style="padding:0.5rem 1rem;">Add</button>
                    </div>
                    <div id="showTurnoversContainer"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- ─── LOAD CONFIG FIRST ─────────────────────────────────── -->
    <script src="config.js"></script>
    
    <!-- ─── LOAD SUPABASE ─────────────────────────────────────── -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ─── MAIN SCRIPT ───────────────────────────────────────── -->
    <script>
        // ═══════════════════════════════════════════════════════════════════
        //  CLASSIC MOVIES — Updated for CLASSICS Schema (FIXED)
        // ═══════════════════════════════════════════════════════════════════

        (function() {
            'use strict';

            console.log('🎬 [CLASSIC MOVIES] Starting... (CLASSICS schema)');

            // ─── READ SUPABASE CONFIG ──────────────────────────────────
            let SUPABASE_URL, SUPABASE_ANON_KEY;
            try {
                if (typeof design !== 'undefined' && design.supabase) {
