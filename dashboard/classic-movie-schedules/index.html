<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classics Collection · Unified Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ─── LIGHT THEME ─── */
        :root {
            --bg-page: #f1f5f9;
            --bg-white: #ffffff;
            --bg-sidebar: #0f172a;
            --bg-card: #ffffff;
            --bg-hover: #f8fafc;
            --bg-input: #fafafa;
            --bg-header: #f8fafc;
            --border-color: #e5e7eb;
            --border-light: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --text-white: #ffffff;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --accent-green: #22c55e;
            --accent-yellow: #eab308;
            --accent-red: #ef4444;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        body {
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ─── UNIFIED DASHBOARD LAYOUT ─── */
        .unified-dashboard {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 1.25rem;
            padding: 1.25rem;
            min-height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
        }

        @media (max-width: 1024px) {
            .unified-dashboard {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
        }

        /* ─── SIDEBAR ─── */
        .sidebar {
            background: var(--bg-sidebar);
            border-radius: 1.5rem;
            padding: 1.25rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            height: calc(100vh - 2.5rem);
            position: sticky;
            top: 1.25rem;
            overflow-y: auto;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .sidebar::-webkit-scrollbar {
            width: 3px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 999px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0 0.5rem 0.75rem 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .sidebar-header .icon-box {
            width: 32px;
            height: 32px;
            background: var(--accent-blue);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .sidebar-header h2 {
            font-size: 0.9rem;
            font-weight: 700;
            color: white;
        }
        .sidebar-header .badge {
            font-size: 0.45rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.1rem 0.4rem;
            border-radius: 999px;
            color: #94a3b8;
            margin-left: auto;
            font-weight: 600;
        }

        .sidebar-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            font-weight: 700;
            padding: 0.5rem 0.5rem 0.25rem 0.5rem;
        }

        .sidebar-btn {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.7rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 500;
            width: 100%;
            text-align: left;
        }
        .sidebar-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: white;
        }
        .sidebar-btn.active {
            background: var(--accent-blue);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .sidebar-btn.active i {
            color: white;
        }
        .sidebar-btn i {
            width: 18px;
            font-size: 0.85rem;
            color: #64748b;
            flex-shrink: 0;
        }
        .sidebar-btn.active i {
            color: white;
        }
        .sidebar-btn .btn-label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin: 0.25rem 0.5rem;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ─── MAIN CONTENT ─── */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Header */
        .main-header {
            background: var(--bg-white);
            border-radius: 1.25rem;
            padding: 0.75rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 0.5rem;
            box-shadow: var(--shadow);
        }
        .main-header h1 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-primary);
        }
        .main-header h1 span {
            color: var(--accent-blue);
        }
        .main-header .header-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn-import {
            background: var(--text-primary);
            color: white;
            border: none;
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .btn-import:hover {
            background: #1e293b;
            transform: scale(1.02);
        }

        .status-badge-top {
            font-size: 0.6rem;
            font-weight: 600;
            padding: 0.15rem 0.6rem;
            border-radius: 9999px;
            border: 1px solid;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .status-badge-top.status-ok {
            background: #dcfce7;
            color: #166534;
            border-color: #86efac;
        }
        .status-badge-top.status-error {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fca5a5;
        }
        .status-badge-top.status-waiting {
            background: #fef3c7;
            color: #92400e;
            border-color: #fcd34d;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.green {
            background: var(--accent-green);
        }
        .status-dot.amber {
            background: var(--accent-yellow);
            animation: pulse 1.5s ease-in-out infinite;
        }
        .status-dot.red {
            background: var(--accent-red);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Stats Row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }
        @media (max-width: 640px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
        .stat-card {
            background: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.6rem 1rem;
            transition: box-shadow 0.2s;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .stat-card:hover {
            box-shadow: var(--shadow-hover);
        }
        .stat-card .stat-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .stat-card .stat-icon.blue {
            background: #eff6ff;
            color: var(--accent-blue);
        }
        .stat-card .stat-icon.amber {
            background: #fffbeb;
            color: #d97706;
        }
        .stat-card .stat-icon.emerald {
            background: #ecfdf5;
            color: #059669;
        }
        .stat-card .stat-info {
            display: flex;
            flex-direction: column;
        }
        .stat-card .stat-label {
            font-size: 0.55rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
        }
        .stat-card .stat-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .stat-card .stat-sub {
            font-size: 0.55rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Show Header (when a show is selected) */
        .show-header {
            background: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.75rem 1.25rem;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .show-header .show-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-primary);
        }
        .show-header .show-title i {
            color: var(--accent-blue);
            margin-right: 0.5rem;
        }
        .show-header .show-stats {
            display: flex;
            gap: 1.5rem;
            font-size: 0.75rem;
        }
        .show-header .show-stats span {
            font-weight: 600;
            color: var(--text-secondary);
        }
        .show-header .show-stats .num {
            color: var(--text-primary);
            font-weight: 700;
        }

        /* Section Cards */
        .section-card {
            background: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .section-card .section-header {
            padding: 0.5rem 1rem;
            font-weight: 700;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-header);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .section-card .section-header i {
            color: var(--accent-blue);
        }
        .section-card .section-header .badge-pill {
            margin-left: auto;
            font-size: 0.5rem;
            font-weight: 600;
            background: #e5e7eb;
            padding: 0.05rem 0.5rem;
            border-radius: 999px;
            color: var(--text-muted);
        }
        .section-card .section-header .progress-text {
            margin-left: auto;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: none;
        }

        /* Table */
        .table-wrap {
            overflow-x: auto;
            padding: 0 0.15rem 0.15rem 0.15rem;
        }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }
        .table-wrap th {
            text-align: left;
            padding: 0.4rem 0.6rem;
            font-weight: 600;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
            background: var(--bg-header);
        }
        .table-wrap td {
            padding: 0.4rem 0.6rem;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
            vertical-align: middle;
        }
        .table-wrap tr:last-child td {
            border-bottom: none;
        }
        .table-wrap tr:hover td {
            background: var(--bg-hover);
        }

        .status-badge {
            padding: 0.05rem 0.5rem;
            border-radius: 999px;
            font-size: 0.6rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-done {
            background: #dcfce7;
            color: #166534;
        }
        .badge-toair {
            background: #fef9c3;
            color: #854d0e;
        }
        .badge-avail {
            background: #dcfce7;
            color: #166534;
        }
        .badge-limited {
            background: #fef9c3;
            color: #854d0e;
        }
        .badge-low {
            background: #fee2e2;
            color: #991b1b;
        }

        .indicator-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .indicator-dot.green {
            background: var(--accent-green);
        }
        .indicator-dot.yellow {
            background: var(--accent-yellow);
        }
        .indicator-dot.red {
            background: var(--accent-red);
        }

        /* Progress Bar */
        .progress-bar-container {
            padding: 0.5rem 1rem 0.75rem 1rem;
        }
        .progress-bar-track {
            height: 6px;
            border-radius: 999px;
            background: #e5e7eb;
            overflow: hidden;
        }
        .progress-bar-track .fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            transition: width 0.6s ease;
        }

        /* Two-column */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 768px) {
            .two-col {
                grid-template-columns: 1fr;
            }
        }

        /* Schedule */
        .schedule-day {
            padding: 0.3rem 0.75rem;
            font-size: 0.7rem;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .schedule-day:last-child {
            border-bottom: none;
        }
        .schedule-day .time {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.6rem;
        }
        .schedule-day .title {
            font-weight: 500;
            color: var(--text-primary);
        }
        .schedule-day .day-label {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        /* Turnovers */
        .turnover-item {
            padding: 0.3rem 0.75rem;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.7rem;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem;
            align-items: center;
        }
        .turnover-item:last-child {
            border-bottom: none;
        }
        .turnover-item .turnover-title {
            font-weight: 600;
            color: var(--text-primary);
        }
        .turnover-item .turnover-dates {
            font-size: 0.6rem;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .turnover-item .turnover-notes {
            grid-column: 1 / -1;
            font-size: 0.55rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* Calendar */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.4rem;
            padding: 0.6rem;
        }
        @media (max-width: 1024px) {
            .calendar-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (max-width: 640px) {
            .calendar-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .calendar-day {
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            overflow: hidden;
            min-height: 50px;
        }
        .calendar-day .day-header {
            background: var(--bg-header);
            padding: 0.15rem 0.3rem;
            font-size: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .calendar-day .day-header .day-num {
            font-weight: 400;
            color: var(--text-muted);
        }
        .calendar-day .day-body {
            padding: 0.15rem 0.2rem;
            max-height: 60px;
            overflow-y: auto;
        }
        .calendar-day .day-body .cal-event {
            font-size: 0.5rem;
            padding: 0.05rem 0.2rem;
            background: white;
            border-radius: 3px;
            border: 1px solid var(--border-color);
            margin-bottom: 0.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
            color: var(--text-primary);
        }
        .calendar-day .day-body .empty-cal {
            font-size: 0.45rem;
            color: #d1d5db;
            text-align: center;
            padding: 0.15rem 0;
            font-style: italic;
        }

        /* ─── MODALS ─── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-card {
            background: var(--bg-white);
            border-radius: 1.25rem;
            max-width: 700px;
            width: 100%;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-card .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
            margin-bottom: 1rem;
        }
        .modal-card .modal-header h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .modal-card .modal-header .close-btn {
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            font-size: 1.25rem;
        }
        .modal-card .modal-header .close-btn:hover {
            color: var(--accent-red);
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .drop-zone:hover {
            border-color: var(--accent-blue);
        }
        .drop-zone i {
            font-size: 2rem;
            color: var(--text-muted);
        }
        .drop-zone p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .import-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 0.5rem;
            margin: 0.75rem 0;
        }
        .import-summary-item {
            background: var(--bg-header);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.4rem;
            text-align: center;
        }
        .import-summary-item .number {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-primary);
        }
        .import-summary-item .label {
            font-size: 0.5rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
        }

        .preview-table-wrap {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            margin: 0.5rem 0;
        }
        .preview-table-wrap table {
            width: 100%;
            font-size: 0.65rem;
            border-collapse: collapse;
        }
        .preview-table-wrap th {
            background: var(--bg-header);
            padding: 0.25rem 0.5rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.55rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
        }
        .preview-table-wrap td {
            padding: 0.25rem 0.5rem;
            border-bottom: 1px solid var(--border-light);
        }

        .btn-sync {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.35rem 1rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-sync:hover {
            background: var(--accent-blue-hover);
        }
        .btn-sync:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #loadingSpinner {

        }
