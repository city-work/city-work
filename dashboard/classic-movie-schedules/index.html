<head>

    <title>Classics Collection · Dark Theme</title>

    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ─── DARK THEME VARIABLES ─── */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2234;
            --bg-card-hover: #243049;
            --bg-input: #1a2234;
            --bg-sidebar: #0d1320;
            --bg-header: #111827;
            --border-color: #2a3a4f;
            --border-light: #1e2d42;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --text-inverse: #0f172a;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-green: #22c55e;
            --accent-yellow: #eab308;
            --accent-red: #ef4444;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --gradient-progress: linear-gradient(90deg, #3b82f6, #22c55e);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ─── UNIFIED DASHBOARD LAYOUT ─── */
        .unified-dashboard {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 1.25rem;
            padding: 1.25rem;
            min-height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
        }

        @media (max-width: 1200px) {
            .unified-dashboard {
                grid-template-columns: 300px 1fr;
            }
        }

        @media (max-width: 1024px) {
            .unified-dashboard {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
        }

        /* ─── SIDEBAR ─── */
        .sidebar {
            background: var(--bg-sidebar);
            border-radius: 1.5rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: calc(100vh - 2.5rem);
            position: sticky;
            top: 1.25rem;
