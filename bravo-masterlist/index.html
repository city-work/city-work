<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bravo Masterlist · ArchiveHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <!-- ═══ LOAD CONFIG FROM ROOT ═══ -->
    <script src="../../config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        midnight: '#18202F',
                        slateblue: '#68748A',
                        mist: '#DCE1E6',
                        warmwhite: '#FAF7F2',
                        copper: '#B8734F',
                        copperhover: '#9D5D3C'
                    }
                }
            }
        }
    </script>

    <style>
        /* ─── RESET & BASE ─── */
        * { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100%; height: 100%; overflow: hidden; background: #DCE1E6; color: #18202F; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.25s ease-out; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }

        /* ─── STATUS BADGE ─── */
        .status-ok { background: #e2e8f0; color: #18202F; border-color: #94a3b8; }
        .status-error { background: #f5e6e6; color: #7a3b3b; border-color: #c9a1a1; }
        .status-waiting { background: #f0ebe6; color: #6b5d4d; border-color: #cdbfae; }
        .status-badge-top { font-size: 0.65rem; font-weight: 600; padding: 0.2rem 0.7rem; border-radius: 9999px; border: 1px solid; display: inline-flex; align-items: center; gap: 0.4rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.green { background: #22c55e; }
        .status-dot.amber { background: #eab308; animation: pulse 1.5s ease-in-out infinite; }
        .status-dot.red { background: #ef4444; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

        /* ─── SIDEBAR ─── */
        .left-rail-full {
            width: 200px; background: #FAF7F2; border-right: 1px solid rgba(24,32,47,0.08);
            padding: 1.25rem 0.75rem; display: flex; flex-direction: column; gap: 0.2rem;
            overflow-y: auto; flex-shrink: 0; transition: width 0.3s ease;
        }
        .left-rail-full.sidebar-collapsed { width: 56px; padding: 0.75rem 0.4rem; }
        .left-rail-full.sidebar-collapsed .brand h2,
        .left-rail-full.sidebar-collapsed .brand .badge,
        .left-rail-full.sidebar-collapsed .nav-item span,
        .left-rail-full.sidebar-collapsed .sidebar-label,
        .left-rail-full.sidebar-collapsed .priority-filter-rail span { display: none; }
        .left-rail-full.sidebar-collapsed .nav-item,
        .left-rail-full.sidebar-collapsed .priority-filter-rail { justify-content: center; padding: 0.5rem; }
        .left-rail-full.sidebar-collapsed .nav-item i,
        .left-rail-full.sidebar-collapsed .priority-filter-rail i { margin-right: 0; }
        .left-rail-full.sidebar-collapsed .brand { padding: 0 0.2rem 0.5rem 0.2rem; justify-content: center; }
        .left-rail-full.sidebar-collapsed .brand .icon-box { width: 28px; height: 28px; font-size: 0.7rem; }

        .left-rail-full .brand {
            display: flex; align-items: center; gap: 0.6rem; padding: 0 0.5rem 0.75rem 0.5rem;
            border-bottom: 1px solid rgba(24,32,47,0.08); margin-bottom: 0.5rem;
        }
        .left-rail-full .brand .icon-box {
            width: 32px; height: 32px; background: #18202F; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; color: #FAF7F2; font-size: 0.9rem;
        }
        .left-rail-full .brand h2 { font-size: 0.9rem; font-weight: 700; color: #18202F; }
        .left-rail-full .brand .badge {
            font-size: 0.45rem; background: rgba(184,115,79,0.15); color: #B8734F;
            padding: 0.1rem 0.4rem; border-radius: 999px; font-weight: 600; margin-left: auto;
        }

        .sidebar-label {
            font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px; color: #68748A;
            font-weight: 700; padding: 0.4rem 0.5rem 0.2rem 0.5rem;
        }
        .sidebar-divider { border: none; border-top: 1px solid rgba(24,32,47,0.08); margin: 0.3rem 0; }

        /* ─── NAV ITEMS ─── */
        .nav-item {
            padding: 0.5rem 0.8rem; border-radius: 0.75rem; font-size: 0.85rem; font-weight: 600;
            color: #68748A; transition: all 0.15s; cursor: pointer; display: flex; align-items: center;
            gap: 0.6rem; border: none; background: transparent; width: 100%; text-align: left; outline: none;
        }
        .nav-item:hover { background: rgba(184,115,79,0.1); color: #B8734F; }
        .nav-item-active { background: rgba(184,115,79,0.2); color: #B8734F; }
        .nav-item:focus-visible,
        .priority-filter-rail:focus-visible,
        button:focus-visible { outline: 2px solid #B8734F; outline-offset: 2px; }

        .priority-filter-rail {
            padding: 0.3rem 0.8rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 600;
            cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 0.5rem;
            border: none; background: transparent; width: 100%; text-align: left; outline: none;
        }
        .priority-filter-rail:hover { background: rgba(184,115,79,0.1); }
        .priority-filter-rail-active { background: rgba(184,115,79,0.2); color: #B8734F; box-shadow: 0 1px 4px rgba(184,115,79,0.15); }

        /* ─── BUTTONS ─── */
        .btn-signout {
            background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; transition: all 0.2s ease;
            font-weight: 600; padding: 0.3rem 0.9rem; border-radius: 9999px; font-size: 0.7rem;
            display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; margin-top: auto;
            border: none; background: transparent; width: 100%;
        }
        .btn-signout:hover { background: #fee2e2; border-color: #ef4444; transform: scale(1.02); }

        /* ─── MAIN CONTENT ─── */
        .date-card-compact {
            padding: 0.75rem 1rem; background: #FAF7F2; border: 1px solid rgba(24,32,47,0.08);
            border-radius: 0.6rem; transition: all 0.2s; cursor: pointer;
        }
        .date-card-compact:hover { border-color: #B8734F; box-shadow: 0 2px 8px -4px rgba(184,115,79,0.15); transform: translateX(4px); }

        .date-note {
            font-size: 0.6rem; color: #B8734F; background: #FAF7F2; padding: 0.05rem 0.3rem;
            border-radius: 0.3rem; border: 1px dashed #cbd5e1; cursor: text; min-height: 1.2rem;
            margin: 0.1rem 0; width: 100%; outline: none; transition: border-color 0.2s, background 0.2s;
        }
        .date-note:focus { border-color: #B8734F; background: #FFFFFF; }
        .date-note:empty::before { content: "📝 Click to add note..."; color: #94a3b8; }
        .date-note:not(:empty)::before { content: ""; }
        .date-note:hover { border-style: solid; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15,23,42,0.4); backdrop-filter: blur(4px);
            z-index: 50; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: #FAF7F2; border-radius: 1.5rem; max-width: 800px; width: 95%;
            max-height: 85vh; overflow-y: auto; padding: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            transform: scale(0.95) translateY(10px); transition: transform 0.25s ease;
        }
        .modal-overlay.open .modal-card { transform: scale(1) translateY(0); }

        .priority-groups-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .priority-groups-table th {
            text-align: left; padding: 0.6rem 0.8rem; font-weight: 600; font-size: 0.55rem;
            text-transform: uppercase; letter-spacing: 0.3px; color: #94a3b8;
            border-bottom: 2px solid rgba(24,32,47,0.1); background: #FAF7F2;
        }
        .priority-groups-table td {
            padding: 0.6rem 0.8rem; border-bottom: 1px solid rgba(24,32,47,0.05);
            color: #18202F; vertical-align: middle;
        }
        .priority-groups-table tr:last-child td { border-bottom: none; }
        .priority-groups-table tr:hover td { background: rgba(220,225,230,0.3); }

        .priority-a { background: #f5e6e6; color: #7a3b3b; }
        .priority-b { background: #f0ebe6; color: #6b5d4d; }
        .priority-c { background: #dbeafe; color: #1e40af; }

        .year-header {
            display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem;
            background: #FAF7F2; border: 1px solid rgba(24,32,47,0.08); border-radius: 0.5rem;
            cursor: pointer; transition: background 0.15s; margin-bottom: 0.5rem; width: 100%;
            border: none; text-align: left; font-size: 0.85rem;
        }
        .year-header:hover { background: rgba(220,225,230,0.4); }
        .year-content { display: block; }
        .year-content.collapsed { display: none; }

        #loadingSpinner {
            display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center;
            flex-direction: column; gap: 1rem;
        }
        #loadingSpinner .spinner {
            width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #B8734F;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── SEARCH BAR (moved to main content) ─── */
        .search-bar {
            display: flex; align-items: center; background: #FAF7F2; border-radius: 0.6rem;
            padding: 0.25rem 0.7rem; border: 1px solid rgba(24,32,47,0.1); transition: all 0.2s;
            max-width: 300px; margin-bottom: 1rem;
        }
        .search-bar:focus-within { border-color: #B8734F; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(184,115,79,0.1); }
        .search-bar input { border: none; background: transparent; outline: none; padding: 0.25rem 0; font-size: 0.75rem; width: 100%; color: #18202F; }
        .search-bar input::placeholder { color: #94a3b8; }
        .search-bar i { color: #94a3b8; font-size: 0.75rem; margin-right: 0.4rem; }

        @media (max-width: 768px) {
            .left-rail-full { width: 56px; padding: 0.75rem 0.4rem; }
            .left-rail-full:not(.sidebar-collapsed) .brand h2,
            .left-rail-full:not(.sidebar-collapsed) .brand .badge,
            .left-rail-full:not(.sidebar-collapsed) .nav-item span,
            .left-rail-full:not(.sidebar-collapsed) .sidebar-label,
            .left-rail-full:not(.sidebar-collapsed) .priority-filter-rail span { display: none; }
            .left-rail-full:not(.sidebar-collapsed) .nav-item,
            .left-rail-full:not(.sidebar-collapsed) .priority-filter-rail { justify-content: center; padding: 0.5rem; }
            .left-rail-full:not(.sidebar-collapsed) .nav-item i,
            .left-rail-full:not(.sidebar-collapsed) .priority-filter-rail i { margin-right: 0; }
            .left-rail-full:not(.sidebar-collapsed) .brand { padding: 0 0.2rem 0.5rem 0.2rem; justify-content: center; }
            .left-rail-full:not(.sidebar-collapsed) .brand .icon-box { width: 28px; height: 28px; font-size: 0.7rem; }
            .left-rail-full.sidebar-expanded .brand h2,
            .left-rail-full.sidebar-expanded .brand .badge,
            .left-rail-full.sidebar-expanded .nav-item span,
            .left-rail-full.sidebar-expanded .sidebar-label,
            .left-rail-full.sidebar-expanded .priority-filter-rail span { display: inline !important; }
            .left-rail-full.sidebar-expanded .nav-item,
            .left-rail-full.sidebar-expanded .priority-filter-rail { justify-content: flex-start; padding: 0.5rem 0.8rem; }
            .left-rail-full.sidebar-expanded .nav-item i,
            .left-rail-full.sidebar-expanded .priority-filter-rail i { margin-right: 0.6rem; }
        }
    </style>
</head>
