<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- FIX: Removed maximum-scale and user-scalable to allow zoom for accessibility -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Work – Login</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

  <!-- Supabase + Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <!-- Font Awesome: only needed styles for better performance -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/solid.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/regular.min.css" />

  <style>
    /* ==========================================================================
       DESIGN TOKENS
       ========================================================================== */
    :root {
      --color-bg: #0f172a;
      --color-glass-bg: rgba(255, 255, 255, 0.10);
      --color-glass-border: rgba(255, 255, 255, 0.15);
      --color-glass-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      --color-primary: #00b4d8;
      --color-primary-hover: #0284c7;
      --color-success: #22c55e;
      --color-error: #f87171;
      --color-text: #ffffff;
      --color-text-muted: rgba(255, 255, 255, 0.7);
      --color-text-dim: rgba(255, 255, 255, 0.35);
      --radius-modal: 40px;
      --radius-input: 16px;
      --radius-btn: 16px;
      --radius-pill: 60px;
      --font-family: 'Inter', sans-serif;
      --transition-smooth: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition-quick: 0.25s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-family: var(--font-family);
      background-color: var(--color-bg);
      /* FIX: Add gradient fallback before remote image */
      background-image: linear-gradient(135deg, #0f172a 0%, #1e293b 100%), url('https://yffqtbqnzrcctfnjibbo.supabase.co/storage/v1/object/public/cats/FB_IMG_1787604930204.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 20px;
      animation: bgZoom 8s ease-in-out infinite alternate;
    }

    @keyframes bgZoom {
      0% { background-size: 100% 100%; }
      100% { background-size: 110% 110%; }
    }

    /* Loading spinner */
    #loadingSpinner {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #loadingSpinner i {
      font-size: 2.5rem;
      color: var(--color-primary);
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #loadingSpinner p {
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
      font-size: 14px;
    }

    /* Trigger bar */
    .trigger-bar {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      width: calc(100% - 40px);
      max-width: 400px;
      background: var(--color-glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--color-glass-border);
      border-radius: var(--radius-pill);
      padding: 18px 24px;
      text-align: center;
      color: var(--color-text);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      transition: all 0.3s ease;
      z-index: 20;
      opacity: 0;
      animation: fadeUp 0.6s var(--transition-smooth) forwards;
    }
    .trigger-bar:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateX(-50%) scale(1.02);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35);
    }
    .trigger-bar:active {
      transform: translateX(-50%) scale(0.96);
    }
    .trigger-bar.hidden {
      opacity: 0 !important;
      transform: translateX(-50%) translateY(30px) !important;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .trigger-bar .arrow {
      display: inline-block;
      margin-left: 10px;
      transition: transform 0.3s ease;
    }
    .trigger-bar:hover .arrow {
      transform: translateY(-3px);
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Login modal */
    .login-sheet {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 90%;
      max-width: 420px;
      min-height: 380px;
      max-height: 85vh;
      background: var(--color-glass-bg);
      backdrop-filter: blur(32px) saturate(1.6);
      -webkit-backdrop-filter: blur(32px) saturate(1.6);
      border-radius: var(--radius-modal);
      border: 1px solid var(--color-glass-border);
      box-shadow: var(--color-glass-shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 32px 28px 28px;
      z-index: 30;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.92);
      transition: opacity 0.4s ease, transform 0.5s var(--transition-smooth);
      pointer-events: none;
      overflow-y: auto;
    }

    .login-sheet::-webkit-scrollbar {
      width: 0;
      background: transparent;
    }

    .login-sheet.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: all;
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 20px;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: var(--color-text);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .close-btn:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    /* Login card */
    .login-card {
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 300px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .sub-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--color-text-muted);
      margin-bottom: 28px;
      text-align: center;
    }

    .input-group {
      margin-bottom: 18px;
      position: relative;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 5px;
    }

    /* FIX: Added extra right padding for validation icon and show-password button */
    input {
      width: 100%;
      padding: 14px 40px 14px 18px;
      background: rgba(255, 255, 255, 0.10);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-input);
      font-size: 15px;
      color: var(--color-text);
      transition: all var(--transition-quick);
      outline: none;
    }
    input::placeholder {
      color: var(--color-text-dim);
    }
    input:focus {
      border-color: var(--color-primary);
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.15);
    }
    input:focus-visible {
      outline: none;
    }

    /* Validation icons */
    .input-group .input-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--color-text-dim);
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--transition-quick);
    }
    .input-group .input-icon.visible {
      opacity: 1;
    }
    .input-group .input-icon.valid {
      color: var(--color-success);
    }
    .input-group .input-icon.invalid {
      color: var(--color-error);
    }

    .input-error {
      border-color: var(--color-error) !important;
      background: rgba(248, 113, 113, 0.12) !important;
      box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.2) !important;
      animation: shake 0.45s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-12px); }
      40% { transform: translateX(12px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    /* Show password toggle button */
    .toggle-password {
      position: absolute;
      right: 40px; /* leaves space for validation icon */
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--color-text-dim);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      transition: color 0.2s;
      z-index: 2;
    }
    .toggle-password:hover {
      color: var(--color-text-muted);
    }
    .toggle-password:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .forgot-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 22px;
    }
    .forgot-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-muted);
      cursor: pointer;
    }
    .forgot-row label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--color-primary);
      padding: 0;
      margin: 0;
    }
    .forgot-link {
      font-size: 14px;
      font-weight: 600;
      color: #90e0ef;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
      font-family: inherit;
    }
    .forgot-link:hover {
      color: var(--color-text);
    }
    .forgot-link:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    button.login-btn {
      width: 100%;
      padding: 16px;
      background: var(--color-primary);
      border: none;
      border-radius: var(--radius-btn);
      color: var(--color-text);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-quick);
      box-shadow: 0 6px 20px rgba(0, 180, 216, 0.35);
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button.login-btn:hover {
      background: var(--color-primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0, 180, 216, 0.45);
    }
    button.login-btn:active {
      transform: scale(0.97);
    }
    button.login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    button.login-btn:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .auth-toggle {
      text-align: center;
      font-size: 14px;
      color: var(--color-text-muted);
      margin-top: 16px;
    }
    .auth-toggle button {
      background: none;
      border: none;
      color: #90e0ef;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: color 0.2s;
    }
    .auth-toggle button:hover {
      color: var(--color-text);
    }
    .auth-toggle button:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    /* Form error */
    .form-error {
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      display: none;
    }
    .form-error.show {
      display: block;
    }
    .form-error.error {
      color: var(--color-error);
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.2);
    }
    .form-error.success {
      color: var(--color-success);
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.2);
    }
    .form-error i {
      margin-right: 6px;
    }

    /* Success state */
    #successContent {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 0;
    }

    .success-wrapper {
      text-align: center;
      width: 100%;
      padding: 0 10px;
    }

    .success-circle {
      width: 80px;
      height: 80px;
      background: var(--color-success);
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: popIn 0.6s var(--transition-smooth);
      box-shadow: 0 0 0 8px rgba(34, 197, 94, 0.2);
      position: relative;
    }
    .success-circle .checkmark {
      position: relative;
      width: 40px;
      height: 40px;
    }
    .success-circle .checkmark::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%) rotate(45deg);
      width: 20px;
      height: 36px;
      border: solid white;
      border-width: 0 5px 5px 0;
      border-radius: 2px;
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-circle {
      animation: popIn 0.6s var(--transition-smooth), pulseGlow 2s ease-in-out 0.6s infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0.2); }
      50% { box-shadow: 0 0 0 16px rgba(34, 197, 94, 0.05); }
    }

    .success-wrapper h2 {
      color: var(--color-success);
      font-weight: 700;
      font-size: 24px;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .success-wrapper p {
      color: rgba(255, 255, 255, 0.85);
      font-size: 15px;
      margin-top: 0;
      word-break: break-word;
    }

    .hidden {
      display: none !important;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .trigger-bar {
        bottom: 30px;
        padding: 16px 20px;
        font-size: 16px;
        width: calc(100% - 30px);
      }
      .login-sheet {
        padding: 28px 20px 24px;
        border-radius: 32px;
        max-height: 80vh;
        min-height: 320px;
      }
      h1 {
        font-size: 24px;
      }
      .sub-text {
        font-size: 13px;
        margin-bottom: 20px;
      }
      input {
        padding: 12px 36px 12px 16px;
        font-size: 14px;
      }
      .close-btn {
        top: 14px;
        right: 16px;
        width: 34px;
        height: 34px;
        font-size: 16px;
      }
      .success-circle {
        width: 70px;
        height: 70px;
      }
      .success-circle .checkmark {
        width: 34px;
        height: 34px;
      }
      .success-circle .checkmark::after {
        width: 16px;
        height: 30px;
        border-width: 0 4px 4px 0;
      }
      .success-wrapper h2 {
        font-size: 20px;
      }
      .toggle-password {
        right: 36px;
      }
    }

    @media (max-height: 640px) {
      .login-sheet {
        padding: 20px 18px 18px;
        max-height: 92vh;
        min-height: 280px;
      }
      .sub-text {
        margin-bottom: 14px;
      }
      .input-group {
        margin-bottom: 12px;
      }
      .forgot-row {
        margin-bottom: 14px;
      }
      button.login-btn {
        padding: 14px;
      }
      h1 {
        font-size: 22px;
      }
      .success-circle {
        width: 60px;
        height: 60px;
      }
      .success-circle .checkmark {
        width: 28px;
        height: 28px;
      }
      .success-circle .checkmark::after {
        width: 14px;
        height: 24px;
        border-width: 0 3px 3px 0;
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- LOADING SPINNER -->
  <div id="loadingSpinner" role="status" aria-live="polite">
    <i class="fa-solid fa-spinner" aria-hidden="true"></i>
    <p>Checking session...</p>
  </div>

  <!-- TRIGGER BAR -->
  <div class="trigger-bar" id="triggerBar" role="button" tabindex="0" aria-label="Open login form">
    Log In <span class="arrow">↑</span>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay" aria-hidden="true"></div>

  <!-- LOGIN MODAL -->
  <div class="login-sheet" id="loginSheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <button class="close-btn" id="closeBtn" aria-label="Close login form">✕</button>

    <div class="login-card" id="loginCard">
      <!-- Form Content -->
      <div id="formContent">
        <h1 id="formTitle">Welcome Back!</h1>
        <p id="formSubtitle" class="sub-text">
          Sign in to your City Work account
        </p>

        <form id="loginForm" novalidate>
          <div class="input-group">
            <label for="email" id="emailLabel">Email</label>
            <!-- FIX: autocomplete="email" for better password manager support -->
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" aria-describedby="emailError" />
            <i class="fa-regular input-icon" id="emailIcon" aria-hidden="true"></i>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <!-- FIX: autocomplete="current-password" (will be updated to "new-password" in signup mode) -->
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" aria-describedby="passwordError" />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
              <i class="fa-regular fa-eye" aria-hidden="true"></i>
            </button>
            <i class="fa-regular input-icon" id="passwordIcon" aria-hidden="true"></i>
          </div>

          <div class="forgot-row">
            <label>
              <input type="checkbox" id="rememberMe" checked />
              Remember Me
            </label>
            <button type="button" id="forgotPasswordBtn" class="forgot-link">Forgot Password?</button>
          </div>

          <button type="submit" id="loginBtn" class="login-btn">
            <span>Login</span>
            <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
          </button>

          <div id="formError" class="form-error" role="alert">
            <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
            <span id="formErrorText">Invalid email or password.</span>
          </div>
        </form>

        <!-- FIX: Removed phone toggle entirely to avoid confusion (Supabase only supports email login) -->

        <!-- AUTH TOGGLE -->
        <div class="auth-toggle">
          <span id="authPromptText">Don't have an account?</span>
          <button id="toggleAuthModeBtn">Create one</button>
        </div>
      </div>

      <!-- SUCCESS STATE -->
      <div id="successContent" class="hidden">
        <div class="success-wrapper">
          <div class="success-circle" aria-hidden="true">
            <div class="checkmark"></div>
          </div>
          <!-- FIX: Success message now includes user email dynamically -->
          <h2 id="successTitle">Welcome to City Work!</h2>
          <p id="successMessage">Redirecting you to your dashboard...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ─── READ SUPABASE CONFIG ──────────────────────────────────────
      let SUPABASE_URL, SUPABASE_ANON_KEY;
      try {
        if (typeof design !== 'undefined' && design.supabase) {
          SUPABASE_URL = design.supabase.url;
          SUPABASE_ANON_KEY = design.supabase.anonKey;
          console.log('✅ [CONFIG] Loaded from config.js');
        } else {
          throw new Error('design.supabase not found');
        }
      } catch (e) {
        console.error('❌ [CONFIG] Failed to load Supabase config:', e);
        document.body.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f172a;padding:20px;font-family:Inter,sans-serif;">
            <div style="background:rgba(255,255,255,0.05);backdrop-filter:blur(16px);border-radius:40px;padding:40px;max-width:400px;text-align:center;border:1px solid rgba(255,255,255,0.1);">
              <i class="fa-solid fa-triangle-exclamation" style="font-size:3rem;color:#f59e0b;margin-bottom:12px;"></i>
              <h2 style="font-size:20px;font-weight:700;color:#fff;">Configuration Error</h2>
              <p style="color:rgba(255,255,255,0.6);margin-top:8px;font-size:14px;">Could not load Supabase credentials. Please check <code style="color:#90e0ef;">config.js</code>.</p>
              <p style="color:rgba(255,255,255,0.4);margin-top:12px;font-size:12px;">Make sure build-config.js ran successfully on Vercel.</p>
            </div>
          </div>
        `;
        return;
      }

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // ─── DOM REFS ──────────────────────────────────────────────
      const form = document.getElementById('loginForm');
      const formTitle = document.getElementById('formTitle');
      const formSubtitle = document.getElementById('formSubtitle');
      const toggleAuthModeBtn = document.getElementById('toggleAuthModeBtn');
      const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
      const authPromptText = document.getElementById('authPromptText');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const formError = document.getElementById('formError');
      const formErrorText = document.getElementById('formErrorText');
      const loginBtn = document.getElementById('loginBtn');
      const rememberMe = document.getElementById('rememberMe');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const emailLabel = document.getElementById('emailLabel');
      const emailIcon = document.getElementById('emailIcon');
      const passwordIcon = document.getElementById('passwordIcon');
      const togglePassword = document.getElementById('togglePassword');
      const successTitle = document.getElementById('successTitle');
      const successMessage = document.getElementById('successMessage');

      // Modal elements
      const triggerBar = document.getElementById('triggerBar');
      const overlay = document.getElementById('overlay');
      const loginSheet = document.getElementById('loginSheet');
      const closeBtn = document.getElementById('closeBtn');
      const formContent = document.getElementById('formContent');
      const successContent = document.getElementById('successContent');

      let isSignupMode = false;

      // ─── MODAL CONTROLS ──────────────────────────────────────────
      function openModal() {
        triggerBar.classList.add('hidden');
        overlay.classList.add('active');
        loginSheet.classList.add('active');
        successContent.classList.add('hidden');
        formContent.classList.remove('hidden');
        email.classList.remove('input-error');
        password.classList.remove('input-error');
        formError.classList.remove('show', 'error', 'success');
        resetValidationIcons();
        // Focus email when modal opens
        setTimeout(() => email.focus(), 300);
      }

      function closeModal() {
        triggerBar.classList.remove('hidden');
        overlay.classList.remove('active');
        loginSheet.classList.remove('active');
        successContent.classList.add('hidden');
        formContent.classList.remove('hidden');
        email.classList.remove('input-error');
        password.classList.remove('input-error');
        formError.classList.remove('show', 'error', 'success');
        resetValidationIcons();
        // Return focus to trigger bar for accessibility
        triggerBar.focus();
      }

      triggerBar.addEventListener('click', openModal);
      triggerBar.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openModal();
        }
      });
      closeBtn.addEventListener('click', closeModal);
      overlay.addEventListener('click', closeModal);

      // ─── FOCUS TRAP (FIX: keep focus inside modal) ─────────────────
      loginSheet.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          const focusable = loginSheet.querySelectorAll(
            'button, input, [tabindex]:not([tabindex="-1"])'
          );
          const first = focusable[0];
          const last = focusable[focusable.length - 1];

          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      });

      // ─── SHOW PASSWORD TOGGLE (FIX: added) ────────────────────────
      togglePassword.addEventListener('click', function() {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        // Toggle icon
        const icon = this.querySelector('i');
        icon.className = type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
        this.setAttribute('aria-label', type === 'password' ? 'Show password' : 'Hide password');
      });

      // ─── REAL‑TIME VALIDATION ──────────────────────────────────────
      function validateField(input, icon) {
        const val = input.value.trim();
        if (val.length === 0) {
          icon.classList.remove('visible', 'valid', 'invalid');
          return;
        }
        icon.classList.add('visible');
        if (input.id === 'email') {
          const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
          icon.className = isEmail
            ? 'fa-regular fa-circle-check input-icon visible valid'
            : 'fa-regular fa-circle-xmark input-icon visible invalid';
        } else if (input.id === 'password') {
          if (val.length >= 6) {
            icon.className = 'fa-regular fa-circle-check input-icon visible valid';
          } else {
            icon.className = 'fa-regular fa-circle-xmark input-icon visible invalid';
          }
        }
      }

      email.addEventListener('input', function() {
        validateField(this, emailIcon);
        this.classList.remove('input-error');
        formError.classList.remove('show', 'error', 'success');
      });
      password.addEventListener('input', function() {
        validateField(this, passwordIcon);
        this.classList.remove('input-error');
        formError.classList.remove('show', 'error', 'success');
      });

      function resetValidationIcons() {
        [emailIcon, passwordIcon].forEach(icon => {
          icon.classList.remove('visible', 'valid', 'invalid');
        });
      }

      // ─── FORM ERROR HANDLING ─────────────────────────────────────
      function setFormError(message, isSuccess = false) {
        if (message) {
          formErrorText.textContent = message;
          formError.classList.add('show');
          formError.classList.remove('error', 'success');
          formError.classList.add(isSuccess ? 'success' : 'error');
          const icon = formError.querySelector('i');
          if (icon) {
            icon.className = isSuccess ? 'fa-regular fa-circle-check' : 'fa-solid fa-circle-exclamation';
          }
        } else {
          formError.classList.remove('show', 'error', 'success');
        }
      }

      // ─── SESSION CHECK ──────────────────────────────────────────
      (async function checkSession() {
        loadingSpinner.style.display = 'flex';
        try {
          const saved = localStorage.getItem('citywork_user');
          if (saved) {
            const userData = JSON.parse(saved);
            if (userData.session && userData.session.access_token) {
              const { data } = await supabase.auth.setSession({
                access_token: userData.session.access_token,
                refresh_token: userData.session.refresh_token
              });
              if (data.user) {
                window.location.href = 'dashboard/index.html';
                return;
              }
            } else if (userData.id) {
              const { data } = await supabase.auth.getSession();
              if (data.session) {
                window.location.href = 'dashboard/index.html';
                return;
              }
            }
          }
          const { data } = await supabase.auth.getSession();
          if (data && data.session) {
            window.location.href = 'dashboard/index.html';
            return;
          }
        } catch (e) {
          console.warn('⚠️ [AUTH] Session check warning:', e);
        } finally {
          loadingSpinner.style.display = 'none';
        }
      })();

      // ─── PROFILE HELPERS ──────────────────────────────────────────
      async function fetchUserRole(userId) {
        try {
          const { data, error } = await supabase
            .from('profiles')
            .select('role')
            .eq('id', userId)
            .maybeSingle();
          if (error) throw error;
          return data?.role || 'user';
        } catch (err) {
          console.warn('⚠️ [AUTH] Role fetch error:', err);
          return 'user';
        }
      }

      async function ensureProfileExists(userId, email) {
        const { data, error } = await supabase
          .from('profiles')
          .select('id')
          .eq('id', userId)
          .maybeSingle();
        if (error && error.code !== 'PGRST116') throw error;
        if (!data) {
          const { error: insertError } = await supabase
            .from('profiles')
            .insert({ id: userId, email: email, role: 'user' });
          if (insertError) throw insertError;
        }
      }

      // ─── UI MODE TOGGLE ──────────────────────────────────────────
      function updateUIMode() {
        if (isSignupMode) {
          formTitle.textContent = 'Create Account';
          formSubtitle.textContent = 'Sign up to get started with City Work';
          loginBtn.innerHTML = '<span>Sign Up</span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i>';
          authPromptText.textContent = 'Already have an account?';
          toggleAuthModeBtn.textContent = 'Sign in';
          forgotPasswordBtn.style.display = 'none';
          // FIX: change autocomplete for signup
          email.setAttribute('autocomplete', 'email');
          password.setAttribute('autocomplete', 'new-password');
        } else {
          formTitle.textContent = 'Welcome Back!';
          formSubtitle.textContent = 'Sign in to your City Work account';
          loginBtn.innerHTML = '<span>Login</span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i>';
          authPromptText.textContent = "Don't have an account?";
          toggleAuthModeBtn.textContent = 'Create one';
          forgotPasswordBtn.style.display = 'inline-block';
          email.setAttribute('autocomplete', 'email');
          password.setAttribute('autocomplete', 'current-password');
        }
        setFormError('');
        resetValidationIcons();
      }

      toggleAuthModeBtn.addEventListener('click', function(e) {
        e.preventDefault();
        isSignupMode = !isSignupMode;
        updateUIMode();
      });

      // ─── FORGOT PASSWORD ──────────────────────────────────────────
      forgotPasswordBtn.addEventListener('click', async function(e) {
        e.preventDefault();
        if (forgotPasswordBtn.style.display === 'none') return;

        const emailVal = email.value.trim();
        if (!emailVal) {
          setFormError('Please enter your email address first.');
          return;
        }

        forgotPasswordBtn.disabled = true;
        forgotPasswordBtn.textContent = 'Sending...';

        try {
          const origin = window.location.origin;
          const path = window.location.pathname.replace(/index\.html$/, '') + 'reset-password.html';
          const resetUrl = origin + path;

          const { error } = await supabase.auth.resetPasswordForEmail(emailVal, {
            redirectTo: resetUrl,
          });
          if (error) throw error;
          setFormError('✅ Password reset email sent! Check your inbox.', true);
          setTimeout(() => setFormError(''), 6000);
        } catch (err) {
          setFormError(err.message || 'Failed to send reset email.');
        } finally {
          forgotPasswordBtn.disabled = false;
          forgotPasswordBtn.textContent = 'Forgot Password?';
        }
      });

      // ─── LOGIN / SIGNUP HANDLERS ──────────────────────────────────
      async function handleLogin(emailVal, passwordVal) {
        const persistSession = rememberMe.checked ? 'local' : 'session';
        const { data, error } = await supabase.auth.signInWithPassword({
          email: emailVal,
          password: passwordVal,
          options: { persistSession: persistSession === 'local' }
        });
        if (error) throw error;

        await ensureProfileExists(data.user.id, data.user.email);
        const role = await fetchUserRole(data.user.id);
        const userData = {
          id: data.user.id,
          email: data.user.email,
          role: role,
          session: data.session
        };
        localStorage.setItem('citywork_user', JSON.stringify(userData));
        return userData;
      }

      async function handleSignup(emailVal, passwordVal) {
        if (passwordVal.length < 6) {
          throw new Error('Password must be at least 6 characters.');
        }
        const { data, error } = await supabase.auth.signUp({
          email: emailVal,
          password: passwordVal,
        });
        if (error) throw error;
        if (!data.user) throw new Error('Signup failed. Please try again.');
        await ensureProfileExists(data.user.id, data.user.email);
        return data;
      }

      // ─── FORM SUBMIT ──────────────────────────────────────────────
      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        formError.classList.remove('show', 'error', 'success');
        email.classList.remove('input-error');
        password.classList.remove('input-error');

        const emailVal = email.value.trim();
        const passwordVal = password.value.trim();

        let valid = true;
        if (!emailVal) {
          email.classList.add('input-error');
          valid = false;
        }
        if (!passwordVal) {
          password.classList.add('input-error');
          valid = false;
        }
        if (!valid) {
          // FIX: Removed useless form shake; input shake is handled by input-error class
          return;
        }

        loginBtn.innerHTML = isSignupMode
          ? '<span>Creating...</span><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>'
          : '<span>Logging in...</span><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>';
        loginBtn.disabled = true;

        try {
          if (isSignupMode) {
            await handleSignup(emailVal, passwordVal);
            setFormError('✅ Account created! Check your email to confirm.', true);
            setTimeout(() => {
              isSignupMode = false;
              updateUIMode();
              password.value = '';
              resetValidationIcons();
              setFormError('');
            }, 3000);
          } else {
            const userData = await handleLogin(emailVal, passwordVal);
            // FIX: Personalised success message with user's email or name
            successTitle.textContent = `Welcome, ${userData.email.split('@')[0]}!`;
            successMessage.textContent = 'Redirecting you to your dashboard...';
            formContent.classList.add('hidden');
            successContent.classList.remove('hidden');
            setTimeout(() => {
              window.location.href = 'dashboard/index.html';
            }, 1500);
          }
        } catch (err) {
          console.error('❌ [AUTH] Error:', err);
          let message = err.message || 'Something went wrong.';
          if (err.message.includes('Email not confirmed')) {
            message = 'Please confirm your email before logging in.';
          } else if (err.message.includes('Invalid login credentials')) {
            message = 'Incorrect email or password. Please try again.';
          } else if (err.message.includes('rate limit')) {
            message = 'Too many attempts. Please wait a moment.';
          }
          setFormError(message);
        } finally {
          loginBtn.innerHTML = isSignupMode
            ? '<span>Sign Up</span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i>'
            : '<span>Login</span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i>';
          loginBtn.disabled = false;
        }
      });

      // ─── ENTER KEY SUPPORT ──────────────────────────────────────
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && loginSheet.classList.contains('active')) {
          // Only trigger if focus is not on a button that has its own action (e.g., forgot password)
          if (document.activeElement.tagName !== 'BUTTON') {
            loginBtn.click();
          }
        }
        if (e.key === 'Escape' && loginSheet.classList.contains('active')) {
          closeModal();
        }
      });

      // ─── INIT ──────────────────────────────────────────────────────
      updateUIMode();
      triggerBar.setAttribute('tabindex', '0');
      triggerBar.setAttribute('role', 'button');
    })();
  </script>
</body>
</html>
